    ${prefGet('au_tip_live') ? '' : `<div class="tip-card"><div class="grow">Enter the weight and reps, then tap <b>✓</b> when you finish a set — your rest timer starts automatically. Tap a <b>Previous</b> value to copy it. Gold notes are your coach’s targets. When you’re done, tap <b>Finish</b>.</div><button class="btn-icon" data-a="tip-x" aria-label="Dismiss tip">${ic('x')}</button></div>`}
    <div id="active-editor"></div>
    <button class="btn btn-block btn-danger" style="margin-top:20px" data-a="discard">Discard Workout</button>`;
  if(!activeCtx || activeCtx.draft !== S.active) activeCtx = { draft:S.active, mode:'active' };
  mountEditor($('#active-editor'), activeCtx);
}

async function startWorkout({ name, routineId=null, items=[] }){
  if(S.active){
    const k = await dialog({ title:'Workout in progress', message:'Finish or discard your current workout before starting a new one.',
      buttons:[{k:'resume', label:'Resume Current', bold:true}, {k:'discard', label:'Discard & Start New', red:true}, {k:'cancel', label:'Cancel'}] });
    if(k === 'resume'){ closeAllSheets(); setTab('workout'); return; }
    if(k !== 'discard') return;
    stopRest();
  }
  unlockAudio();
  const d = { id:uid(), name: name || defaultName(), start:new Date().toISOString(), routineId, notes:'', entries:[] };
  d.entries = items.filter(i => i.exId).map(i => newEntry(i.exId, d, i.sets, i.note));
  S.active = d;
  save(); closeAllSheets();
  ui.scroll.workout = 0;
  if(ui.tab === 'workout') render(); else setTab('workout');
  window.scrollTo(0, 0);
  syncWakeLock();
}
function newEntry(exId, draft, n, note){
  const ex = getEx(exId), prev = lastPerf(exId, draft);
  if(isTimedEx(ex)){
    const iv = exIv(ex), count = Math.min(20, n || iv.sets);
    return { exId, name:ex.name, cat:ex.cat, ...(note ? { coach:note } : {}), mode:'timed', iv:{ work:iv.work, rest:iv.rest }, sets:Array.from({ length:count }, () => ({ w:null, r:null, t:null, done:false })) };
  }
  const count = Math.min(12, n || (prev ? prev.length : 3));
  return { exId, name:ex.name, cat:ex.cat, ...(note ? { coach:note } : {}), sets:Array.from({ length:count }, () => ({ w:null, r:null, done:false })) };
}
function routineItems(sess){ return sess.entries.map(e => ({ exId:e.exId, sets:Math.min(12, e.sets.length) })); }
function startRoutine(id){ const r = S.routines.find(x => x.id === id); if(r) startWorkout({ name:r.name, routineId:r.id, items:r.items }); }
function repeatSession(id){ const s = S.sessions.find(x => x.id === id); if(s) startWorkout({ name:s.name, routineId:s.routineId, items:routineItems(s) }); }

async function finishWorkout(){
  const d = S.active; if(!d) return;
  if(document.activeElement) document.activeElement.blur();
  const pending = [];
  d.entries.forEach(en => en.sets.forEach(s => { if(!s.done && s.r > 0) pending.push([en, s]); }));
  if(pending.length){
    const k = await dialog({ title:`${plural(pending.length,'set')} not ticked off`, message:'These sets have reps entered but weren’t marked complete.',
      buttons:[{k:'log', label:'Log Them Too', bold:true}, {k:'drop', label:'Leave Them Out'}, {k:'cancel', label:'Cancel'}] });
    if(!k || k === 'cancel') return;
    if(k === 'log') pending.forEach(([en, s]) => { s.done = true; if(s.w == null) s.w = 0; if(en.mode === 'timed' && !s.t) s.t = en.iv.work; });
  }
  const entries = cleanEntries(d.entries, false);
  if(!entries.length){
    const k = await dialog({ title:'No sets completed', message:'Tick off at least one set to save this workout.', buttons:[{k:'discard', label:'Discard', red:true}, {k:'back', label:'Keep Going', bold:true}] });
    if(k === 'discard') discardNow();
    return;
  }
  const sess = { id:d.id, name:(d.name||'').trim() || defaultName(new Date(d.start)), start:d.start, end:new Date().toISOString(), legacy:false, routineId:d.routineId||null, notes:(d.notes||'').trim(), entries };
  S.sessions.push(sess);
  S.active = null;
  rest.end = 0; rest.doneUntil = 0;
  save(); syncWakeLock(); render(); updateDock();
  showSummary(sess);
}
function cleanEntries(entries, ignoreDone){
  return entries.map(en => {
    const ex = getEx(en.exId);
    return { exId:en.exId, name:ex.name, cat:ex.cat, sets: en.sets.filter(s => (ignoreDone || s.done) && (s.r > 0 || s.t > 0)).map(s => {
      const o = { w: Math.max(0, s.w || 0), r: s.r || 0 };
      const t = s.t > 0 ? s.t : (en.mode === 'timed' && en.iv ? en.iv.work : 0);
      if(t > 0) o.t = t;
      return o;
    }) };
  }).filter(e => e.sets.length);
}
function discardNow(){ S.active = null; rest.end = 0; rest.doneUntil = 0; save(); syncWakeLock(); render(); updateDock(); toast('Workout discarded'); }
async function discardWorkout(){
  if(await confirmDlg('Discard workout?', 'Everything you’ve logged in this workout will be lost.', 'Discard')) discardNow();
}

function showSummary(sess){
  const prs = cache().prs[sess.id] || [];
  const r = sess.routineId && S.routines.find(x => x.id === sess.routineId);
  const differs = r && JSON.stringify(r.items) !== JSON.stringify(routineItems(sess));
  const dur = sessDur(sess);
  const s = openSheet({ render: () => `${sheetHead('', '', btnClose('Done', true))}
    <div class="sheet-body">
      <div class="done-badge${prs.length?' pr':''}">${ic(prs.length ? 'trophy' : 'check')}</div>
      <h2 class="sheet-h1 center">Workout complete</h2>
      <div class="muted center" style="margin-bottom:18px">${esc(sess.name)}</div>
      <div class="tiles">
        ${tile('Duration', dur ? fmtDurShort(dur) : '—')}
        ${tile('Sets', sessSets(sess))}
      </div>
      ${prs.length ? `<div class="group-h">${plural(prs.length,'personal record')}</div><div class="list">${prs.map(p => { const t = prText(p); return `<div class="row">${ic('trophy')}<div class="grow"><div class="title">${esc(getEx(p.exId).name)}</div><div class="sub">${esc(t.label)}</div></div><span class="trail num" style="color:var(--orange);font-weight:600">${esc(t.text)}</span></div>`; }).join('')}</div>` : ''}
      <div class="group-h">Exercises</div>
      <div class="list">${sess.entries.map(e => { const b = entryBest(e.sets); return `<div class="row"><div class="grow"><div class="title">${esc(e.name)}</div><div class="sub">${plural(e.sets.length,'set')}</div></div><span class="trail num">${bestLabel(b) ? 'Best ' + bestLabel(b) : ''}</span></div>`; }).join('')}</div>
      <div class="btn-col">
        ${!r ? `<button class="btn btn-block btn-tinted" data-a="as-routine">${ic('repeat')} Save as Routine</button>` : differs ? `<button class="btn btn-block btn-tinted" data-a="update-routine">${ic('repeat')} Update “${esc(r.name)}”</button>` : ''}
        <button class="btn btn-block btn-primary" data-a="close">Done</button>
      </div>
    </div>`,
    actions: {
      'as-routine': async () => { if(await saveAsRoutine(sess.id)) s.close(); },
      'update-routine': () => { r.items = routineItems(sess); save(); refresh(); toast(`“${r.name}” updated`); s.close(); }
    }
  });
}
async function saveAsRoutine(sessId){
  const sess = S.sessions.find(x => x.id === sessId); if(!sess) return false;
  const name = await promptDlg('Save as Routine', 'Give this routine a name.', sess.name, 'e.g. Push Day');
  if(name == null) return false;
  const r = { id:uid(), name:name.trim() || sess.name, items:routineItems(sess) };
  S.routines.push(r);
  const orig = S.sessions.find(x => x.id === sessId); if(orig && !orig.routineId) orig.routineId = r.id;
  save(); refresh(); toast(`Routine “${r.name}” saved`);
  return true;
}

/* =========================================================
   Workout editor (used for the live workout and for editing past ones)
   ========================================================= */
function mountEditor(root, ctx){
  ctx.root = root;
  root.classList.add('editor');
  if(ctx.mode === 'edit') root.classList.add('edit');
  root.addEventListener('click', e => edClick(ctx, e));
  root.addEventListener('input', e => edInput(ctx, e));
  root.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.classList.contains('ed-name')) e.target.blur(); });
  renderEditor(ctx);
}
function renderEditor(ctx){
  const d = ctx.draft;
  const meta = ctx.mode === 'active'
    ? `<span>${ic('clock')}<b data-elapsed="${esc(d.start)}">${fmtDur(Date.now() - new Date(d.start))}</b></span>`
    : `<span>${ic('calendar')}<input type="datetime-local" class="ed-dt" data-f="start" value="${toLocalInput(d.start)}" aria-label="Start time"></span><span>${ic('clock')}<input class="ed-dt ed-dur" data-f="dur" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${d.durMin || ''}" placeholder="–" aria-label="Duration in minutes"> min</span>`;
  ctx.root.innerHTML = `
    <input class="ed-name" data-f="name" value="${esc(d.name)}" placeholder="Workout name" enterkeyhint="done" autocomplete="off">
    <div class="ed-meta">${meta}<span>${ic('check')}<b class="m-sets">0</b><span class="m-sets-l">sets</span></span></div>
    ${ctx.hint ? `<div class="ed-hint">${ctx.hint}</div>` : ''}
    ${d.entries.map((en, i) => entryHTML(ctx, en, i)).join('') || `<div class="ed-empty">${ic('dumbbell')}<div>Add an exercise to get started</div></div>`}
    <button class="btn btn-block btn-tinted" data-ed="add-ex">${ic('plus')} Add Exercises</button>
    <textarea class="field ed-notes" data-f="notes" rows="2" placeholder="Workout notes (optional)">${esc(d.notes || '')}</textarea>`;
  updateMeta(ctx);
}
function phFor(ctx, en, si){
  const prev = lastPerf(en.exId, ctx.draft);
  if(prev && prev[si]) return prev[si];
  const before = si > 0 && en.sets[si-1];
  if(before && before.r > 0) return { w:before.w || 0, r:before.r };
  if(prev && prev.length) return prev[prev.length-1];
  return null;
}
function entryHTML(ctx, en, i){
  const ex = getEx(en.exId);
  const prev = lastPerf(en.exId, ctx.draft);
  const best = bestFor(en.exId, ctx.draft);
  if(en.mode === 'timed') return timedEntryHTML(ctx, en, i, ex, prev, best);
  const sub = [`<span>${esc(ex.cat)}</span>`];
  if(ctx.mode === 'active') sub.push(`<span>${ic('timer')}${fmtClock(restFor(en.exId))}</span>`);
  const bl = bestLabel(best); if(bl) sub.push(`<span class="pr">${ic('trophy')}${bl}</span>`);
  return `<section class="ex-card" data-ei="${i}">
    <div class="ex-head"><button class="ex-name" data-ed="ex-info">${esc(ex.name)}</button><button class="btn-icon" data-ed="ex-menu" aria-label="Exercise options">${ic('more')}</button></div>
    <div class="ex-sub">${sub.join('<span class="dot">·</span>')}</div>
    ${en.coach ? `<div class="ex-coach"><b>Coach</b><span>${esc(en.coach)}</span></div>` : ''}
    <div class="set-grid set-head"><span>Set</span><span>Previous</span><span>${U()}</span><span>Reps</span><span>${ic('check')}</span></div>
    ${en.sets.map((s, j) => setHTML(ctx, en, s, j, prev, best)).join('')}
    <button class="add-set" data-ed="add-set">${ic('plus')} Add Set</button>
  </section>`;
}
function setHTML(ctx, en, s, j, prev, best){
  const p = prev && prev[j];
  const ph = phFor(ctx, en, j);
  const pr = ctx.mode === 'active' && s.done && isPR(s, best);
  return `<div class="set-grid set-row${s.done ? ' done' : ''}${pr ? ' pr' : ''}" data-si="${j}">
    <button class="set-num" data-ed="set-menu" aria-label="Set ${j+1} options">${pr ? ic('trophy') : j+1}</button>
    <button class="set-prev" data-ed="use-prev" ${p ? '' : 'disabled'}>${p ? setStr(p, false) : '—'}</button>
    <input class="set-in" data-f="w" inputmode="decimal" autocomplete="off" value="${s.w != null ? fmtW(s.w) : ''}" placeholder="${ph ? (ph.w > 0 ? fmtW(ph.w) : '0') : ''}" aria-label="Weight">
    <input class="set-in" data-f="r" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${s.r != null ? s.r : ''}" placeholder="${ph ? ph.r : ''}" aria-label="Reps">
    <button class="set-check" data-ed="check" aria-label="Complete set">${ic('check')}</button>
  </div>`;
}
function timedEntryHTML(ctx, en, i, ex, prev, best){
  const iv = en.iv, active = ctx.mode === 'active', left = en.sets.filter(s => !s.done).length;
  const sub = [`<span>${esc(ex.cat)}</span>`, `<span>${ic('timer')}${fmtSecs(iv.work)} on · ${fmtSecs(iv.rest)} off</span>`];
  const bl = bestLabel(best, true); if(bl) sub.push(`<span class="pr">${ic('trophy')}${bl}</span>`);
  const step = (label, k, val) => `<div class="iv-f"><span>${label}</span><div class="stepper sm"><button data-ed="iv-cfg" data-k="${k}" data-d="-1" aria-label="Less ${label.toLowerCase()}">−</button><span>${val}</span><button data-ed="iv-cfg" data-k="${k}" data-d="1" aria-label="More ${label.toLowerCase()}">+</button></div></div>`;
  return `<section class="ex-card timed" data-ei="${i}">
    <div class="ex-head"><button class="ex-name" data-ed="ex-info">${esc(ex.name)}</button><button class="btn-icon" data-ed="ex-menu" aria-label="Exercise options">${ic('more')}</button></div>
    <div class="ex-sub">${sub.join('<span class="dot">·</span>')}</div>
    ${en.coach ? `<div class="ex-coach"><b>Coach</b><span>${esc(en.coach)}</span></div>` : ''}
    ${active ? `<div class="iv-cfg">${step('Work', 'work', fmtSecs(iv.work))}${step('Rest', 'rest', fmtSecs(iv.rest))}${step('Sets', 'sets', en.sets.length)}</div>` : ''}
    <div class="set-grid set-head"><span>Set</span><span>Secs</span><span>${U()}</span><span>Reps</span><span>${ic('check')}</span></div>
    ${en.sets.map((s, j) => timedSetHTML(ctx, en, s, j, prev, best)).join('')}
    ${active
      ? (left ? `<button class="btn btn-block btn-green iv-go" data-ed="iv-start">${ic('play')} ${left === en.sets.length ? 'Start' : 'Continue'} · ${plural(left, 'set')} of ${fmtSecs(iv.work)}</button>` : '')
      : `<button class="add-set" data-ed="add-set">${ic('plus')} Add Set</button>`}
  </section>`;
}
function timedSetHTML(ctx, en, s, j, prev, best){
  const p = prev && prev[j], ph = phFor(ctx, en, j);
  const pr = ctx.mode === 'active' && s.done && isPR(s, best);
  return `<div class="set-grid set-row${s.done ? ' done' : ''}${pr ? ' pr' : ''}" data-si="${j}">
    <button class="set-num" data-ed="set-menu" aria-label="Set ${j+1} options">${pr ? ic('trophy') : j+1}</button>
    <input class="set-in" data-f="t" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${s.t || ''}" placeholder="${en.iv.work}" aria-label="Seconds">
    <input class="set-in" data-f="w" inputmode="decimal" autocomplete="off" value="${s.w > 0 ? fmtW(s.w) : ''}" placeholder="${ph && ph.w > 0 ? fmtW(ph.w) : '–'}" aria-label="Weight (optional)">
    <input class="set-in" data-f="r" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${s.r || ''}" placeholder="${p && p.r ? p.r : '–'}" aria-label="Reps (optional)">
    <button class="set-check" data-ed="check" aria-label="Complete set">${ic('check')}</button>
  </div>`;
}
function updateMeta(ctx){
  let n = 0;
  for(const e of ctx.draft.entries) for(const s of e.sets){ if(ctx.mode === 'edit' ? (s.r > 0 || s.t > 0) : s.done) n++; }
  const a = ctx.root.querySelector('.m-sets');
  if(a) a.textContent = n;
  const l = ctx.root.querySelector('.m-sets-l'); if(l) l.textContent = n === 1 ? 'set' : 'sets';
}
function changed(ctx, structural){
  if(structural) renderEditor(ctx); else updateMeta(ctx);
  if(ctx.mode === 'active') saveSoon();
}
function refreshRowPR(ctx, en, s, row, si){
  if(ctx.mode !== 'active') return false;
  const pr = s.done && isPR(s, bestFor(en.exId, ctx.draft));
  row.classList.toggle('pr', pr);
  row.querySelector('.set-num').innerHTML = pr ? ic('trophy') : si + 1;
  return pr;
}
function edInput(ctx, e){
  const t = e.target, f = t.dataset.f; if(!f) return;
  const d = ctx.draft;
  if(f === 'name') d.name = t.value;
  else if(f === 'notes') d.notes = t.value;
  else if(f === 'start'){ const dt = new Date(t.value); if(!isNaN(dt)) d.start = dt.toISOString(); }
  else if(f === 'dur'){ const n = parseInt(t.value, 10); d.durMin = n > 0 ? Math.min(600, n) : null; }
  else {
    const row = t.closest('.set-row'), ei = +t.closest('.ex-card').dataset.ei, si = +row.dataset.si;
    const en = d.entries[ei], s = en.sets[si], raw = t.value.trim();
    if(f === 'w'){ const n = toNum(raw); s.w = (raw === '' || isNaN(n)) ? null : Math.max(0, fromDisp(n)); }
    else if(f === 't'){ const n = parseInt(raw, 10); s.t = (raw === '' || isNaN(n) || n <= 0) ? null : Math.min(3600, n); }
    else { const n = parseInt(raw, 10); s.r = (raw === '' || isNaN(n)) ? null : Math.max(0, n); }
    if(s.done) refreshRowPR(ctx, en, s, row, si);
  }
  changed(ctx);
}
function edClick(ctx, e){
  const t = e.target.closest('[data-ed]'); if(!t || !ctx.root.contains(t)) return;
  const card = t.closest('.ex-card'), ei = card ? +card.dataset.ei : -1;
  const en = ctx.draft.entries[ei];
  const row = t.closest('.set-row'), si = row ? +row.dataset.si : -1;
  switch(t.dataset.ed){
    case 'add-ex':
      pickExercises({ onDone: ids => { ids.forEach(id => ctx.draft.entries.push(newEntry(id, ctx.draft))); changed(ctx, true); } });
      break;
    case 'ex-info': openExerciseDetail(en.exId); break;
    case 'ex-menu': exMenu(ctx, ei); break;
    case 'add-set': {
      const last = en.sets[en.sets.length-1];
      if(en.mode === 'timed') en.sets.push({ w: last ? last.w : null, r:null, t: (last && last.t) || en.iv.work, done:false });
      else en.sets.push({ w: last && last.w != null ? last.w : null, r: last && last.r != null ? last.r : null, done:false });
      changed(ctx, true);
      break;
    }
    case 'iv-cfg': {
      const k = t.dataset.k, d = +t.dataset.d;
      if(k === 'sets'){
        if(d > 0){ const last = en.sets[en.sets.length-1]; if(en.sets.length >= 20) break; en.sets.push({ w: last ? last.w : null, r:null, t:null, done:false }); }
        else {
          const i = en.sets.map(x => x.done).lastIndexOf(false);
          if(i < 0){ toast('All sets are already done'); break; }
          if(en.sets.length <= 1) break;
          en.sets.splice(i, 1);
        }
      }
      else if(k === 'work') en.iv.work = Math.max(5, Math.min(600, en.iv.work + d*5));
      else en.iv.rest = Math.max(0, Math.min(600, en.iv.rest + d*5));
      changed(ctx, true);
      break;
    }
    case 'iv-start': startIntervals(ctx, en); break;
    case 'set-menu': setMenu(ctx, ei, si); break;
    case 'use-prev': {
      const p = (lastPerf(en.exId, ctx.draft) || [])[si]; if(!p) break;
      const s = en.sets[si]; s.w = p.w; s.r = p.r;
      row.querySelector('[data-f=w]').value = fmtW(p.w);
      row.querySelector('[data-f=r]').value = p.r;
      if(s.done) refreshRowPR(ctx, en, s, row, si);
      changed(ctx);
      break;
    }
    case 'check': toggleSet(ctx, ei, si, row); break;
  }
}
function toggleSet(ctx, ei, si, row){
  const en = ctx.draft.entries[ei], s = en.sets[si];
  unlockAudio();
  if(s.done){
    s.done = false; row.classList.remove('done', 'pr');
    row.querySelector('.set-num').textContent = si + 1;
    changed(ctx, en.mode === 'timed'); return;
  }
  const ph = phFor(ctx, en, si);
  if(en.mode === 'timed'){
    if(!s.t) s.t = en.iv.work;
    if(s.w == null) s.w = ph ? ph.w || 0 : 0;
    s.done = true;
    const pr = isPR(s, bestFor(en.exId, ctx.draft));
    if(pr){ toast(`🏆 New PR — ${getEx(en.exId).name}`); haptic([30,50,30]); } else haptic(15);
    if(ctx.mode === 'active' && S.settings.autoRest && en.iv.rest > 0) startRest(en.iv.rest, getEx(en.exId).name);
    changed(ctx, true); return;
  }
  if(s.w == null && ph) s.w = ph.w;
  if(s.r == null && ph) s.r = ph.r;
  if(!(s.r > 0)){
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
    toast('Enter reps for this set'); return;
  }
  if(s.w == null) s.w = 0;
  s.done = true;
  row.querySelector('[data-f=w]').value = fmtW(s.w);
  row.querySelector('[data-f=r]').value = s.r;
  row.classList.add('done', 'just'); setTimeout(() => row.classList.remove('just'), 350);
  if(refreshRowPR(ctx, en, s, row, si)){ toast(`🏆 New PR — ${getEx(en.exId).name}`); haptic([30,50,30]); }
  else haptic(15);
  if(ctx.mode === 'active' && S.settings.autoRest) startRest(restFor(en.exId), getEx(en.exId).name);
  changed(ctx);
}
async function exMenu(ctx, ei){
  const en = ctx.draft.entries[ei], ex = getEx(en.exId), n = ctx.draft.entries.length;
  const actions = [];
  if(ctx.mode === 'edit'){
    if(lastPerf(en.exId, ctx.draft)) actions.push({ k:'fill', label:'Fill Sets from Last Time' });
    const s0 = en.sets[0];
    if(en.sets.length > 1 && s0 && (s0.r > 0 || s0.t > 0 || s0.w > 0)) actions.push({ k:'copy1', label:'Copy Set 1 to All Sets' });
  }
  if(!ex.deleted) actions.push({ k:'mode', label: en.mode === 'timed' ? 'Switch to Reps & Weight' : 'Switch to Timed Sets' });
  if(!ex.deleted && en.mode !== 'timed' && ctx.mode === 'active') actions.push({ k:'rest', label:`Rest Timer (${fmtClock(restFor(en.exId))})` });
  if(ei > 0) actions.push({ k:'up', label:'Move Up' });
  if(ei < n-1) actions.push({ k:'down', label:'Move Down' });
  actions.push({ k:'info', label:'History & Charts' });
  actions.push({ k:'remove', label:'Remove Exercise', red:true });
  const k = await actionSheet({ title:ex.name, actions });
  const list = ctx.draft.entries;
  if(k === 'fill'){
    const prev = lastPerf(en.exId, ctx.draft) || [];
    en.sets = prev.map(p => ({ w:p.w, r:p.r || null, t:p.t || null, done:true }));
    changed(ctx, true);
  }
  else if(k === 'copy1'){
    const s0 = en.sets[0];
    en.sets = en.sets.map((x, i) => i === 0 ? x : { ...x, w:s0.w, r:s0.r, t:s0.t });
    changed(ctx, true);
  }
  else if(k === 'mode'){
    const toTimed = en.mode !== 'timed', keep = en.sets.filter(s => s.done);
    if(toTimed){ ex.mode = 'timed'; ex.iv = exIv(ex); en.mode = 'timed'; en.iv = { work:ex.iv.work, rest:ex.iv.rest }; }
    else { delete ex.mode; delete en.mode; delete en.iv; }
    const want = toTimed ? ex.iv.sets : 3;
    en.sets = keep.concat(Array.from({ length:Math.max(0, want - keep.length) }, () => ({ w:null, r:null, t:null, done:false })));
    save(); changed(ctx, true);
    toast(`${ex.name} now uses ${toTimed ? 'timed' : 'reps & weight'} sets`);
  }
  else if(k === 'rest'){
    const r = await chooseRest(`Rest timer for ${ex.name}`, true); if(r == null) return;
    if(r === 'default') delete ex.rest; else ex.rest = r;
    save(); changed(ctx, true);
  }
  else if(k === 'up'){ [list[ei-1], list[ei]] = [list[ei], list[ei-1]]; changed(ctx, true); }
  else if(k === 'down'){ [list[ei+1], list[ei]] = [list[ei], list[ei+1]]; changed(ctx, true); }
  else if(k === 'info') openExerciseDetail(en.exId);
  else if(k === 'remove'){
    if(en.sets.some(s => s.done || s.r > 0) && !(await confirmDlg(`Remove ${ex.name}?`, 'The sets you’ve entered for it will be removed.', 'Remove'))) return;
    list.splice(ei, 1); changed(ctx, true);
  }
}
async function setMenu(ctx, ei, si){
  const en = ctx.draft.entries[ei];
  const k = await actionSheet({ title:`Set ${si+1}`, actions:[{ k:'dup', label:'Duplicate Set' }, { k:'del', label:'Delete Set', red:true }] });
  if(k === 'dup'){ const s = en.sets[si]; en.sets.splice(si+1, 0, { w:s.w, r:s.r, t:s.t || null, done:false }); changed(ctx, true); }
  else if(k === 'del'){ en.sets.splice(si, 1); changed(ctx, true); }
}

/* =========================================================
   Guided interval timer for timed sets: get ready → work → rest → …
   Uses end timestamps, so it stays accurate if the phone sleeps briefly.
   ========================================================= */
const IV = { on:false };
const IV_C = 2*Math.PI*46;
function startIntervals(ctx, en){
  const queue = en.sets.map((s, i) => i).filter(i => !en.sets[i].done);
  if(!queue.length){ toast('All sets are already done'); return; }
  if(document.activeElement) document.activeElement.blur();
  unlockAudio(); stopRest();
  Object.assign(IV, { on:true, ctx, en, queue, qi:0, phase:'prep', dur:3, end:Date.now() + 3000, paused:false, left:0, beeped:'', repsFor:null, prDone:{} });
  let el = $('#iv');
  if(!el){ el = document.createElement('div'); el.id = 'iv'; el.setAttribute('role', 'dialog'); document.body.appendChild(el); el.addEventListener('click', ivClick); el.addEventListener('input', ivInput); }
  renderIV(); syncWakeLock();
}
const ivWork = si => IV.en.sets[si].t || IV.en.iv.work;
const ivRemaining = () => IV.paused ? IV.left : Math.max(0, IV.end - Date.now());
function ivPhase(p, dur){
  Object.assign(IV, { phase:p, dur, end:Date.now() + dur*1000, paused:false });
  if(p === 'work'){ tones([[0, 988, .12], [.15, 988, .3]]); haptic(80); }
  else if(p === 'rest'){ tones([[0, 587, .35]]); haptic([40, 40, 40]); }
  renderIV();
}
function ivAdvance(skipped){
  const en = IV.en;
  if(IV.phase === 'prep') return ivPhase('work', ivWork(IV.queue[IV.qi]));
  if(IV.phase === 'rest') return ivPhase('work', ivWork(IV.queue[IV.qi]));
  if(IV.phase !== 'work') return;
  const si = IV.queue[IV.qi], s = en.sets[si];
  s.t = skipped ? Math.max(1, Math.round(IV.dur - ivRemaining()/1000)) : IV.dur;
  if(s.w == null){ const ph = phFor(IV.ctx, en, si); s.w = ph ? ph.w || 0 : 0; }
  s.done = true; IV.repsFor = si; saveSoon();
  if(IV.qi >= IV.queue.length - 1){ IV.phase = 'done'; beep(); haptic([200, 100, 200]); renderIV(); return; }
  IV.qi++;
  if(en.iv.rest > 0) ivPhase('rest', en.iv.rest); else ivPhase('work', ivWork(IV.queue[IV.qi]));
}
function ivTick(){
  if(IV.paused || IV.phase === 'done') return;
  const ms = IV.end - Date.now();
  if(ms <= 0){ ivAdvance(false); return; }
  const secs = Math.ceil(ms/1000), key = IV.phase + IV.qi + ':' + secs;
  if(secs <= 3 && IV.beeped !== key){ IV.beeped = key; tones([[0, 660, .09]]); }
  updateIV();
}
function updateIV(){
  const el = $('#iv'); if(!el) return;
  const ms = ivRemaining(), secs = Math.ceil(ms/1000);
  const t = el.querySelector('.iv-time'); if(t) t.textContent = secs >= 60 ? fmtClock(secs) : secs;
  const a = el.querySelector('.iv-arc'); if(a) a.setAttribute('stroke-dashoffset', (IV_C * (1 - ms / (IV.dur*1000))).toFixed(1));
}
function ivRepRow(si, ask){
  const s = IV.en.sets[si], prev = lastPerf(IV.en.exId, IV.ctx.draft), p = prev && prev[si];
  return `<div class="iv-rep" data-si="${si}"><div class="l">${ask ? `Reps in set ${si+1}?` : `Set ${si+1}`}<small>${s.t}s${p && p.r ? ` · last time ${p.r}` : ''}${ask ? ' · optional' : ''}</small></div>
    <button data-iv="rep" data-d="-1" aria-label="Fewer reps">−</button><input inputmode="numeric" pattern="[0-9]*" value="${s.r || ''}" placeholder="–" aria-label="Reps in set ${si+1}"><button data-iv="rep" data-d="1" aria-label="More reps">+</button></div>`;
}
function renderIV(){
  const el = $('#iv'); if(!el) return;
  const en = IV.en, ex = getEx(en.exId), total = en.sets.length;
  if(IV.phase === 'done'){
    const run = IV.queue.map(si => en.sets[si]).filter(s => s.done);
    el.className = 'iv done';
    el.innerHTML = `<div class="iv-top"><span></span><div class="iv-title">${esc(ex.name)}</div><span></span></div>
      <div class="iv-finish"><div class="done-badge">${ic('check')}</div><h2>Nice work!</h2><div class="muted">${plural(run.length, 'set')} · ${fmtClock(run.reduce((a, s) => a + s.t, 0))} of work</div></div>
      <div class="iv-sets"><div class="small muted" style="margin:0 4px 2px">Reps per set — optional</div>${IV.queue.filter(si => en.sets[si].done).map(si => ivRepRow(si)).join('')}</div>
      <div class="iv-ctrl"><button class="pri" data-iv="close">Done</button></div>`;
    return;
  }
  const si = IV.queue[IV.qi], last = IV.qi >= IV.queue.length - 1;
  const label = { prep:'GET READY', work:'WORK', rest:'REST' }[IV.phase];
  const next = IV.phase === 'prep' ? `First up: ${fmtSecs(ivWork(si))} of work`
    : IV.phase === 'work' ? (last ? 'Last set — empty the tank!' : en.iv.rest > 0 ? `Next: ${fmtSecs(en.iv.rest)} rest` : 'Next: straight into the next set')
    : `Next: set ${si+1} · ${fmtSecs(ivWork(si))}`;
  el.className = 'iv ' + IV.phase + (IV.paused ? ' paused' : '');
  el.innerHTML = `
    <div class="iv-top"><button class="iv-x" data-iv="stop">End</button><div class="iv-title">${esc(ex.name)}</div><div class="iv-count">Set ${si+1}/${total}</div></div>
    <div class="iv-main"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5"/><circle class="iv-arc" cx="50" cy="50" r="46" fill="none" stroke="var(--ivc)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${IV_C.toFixed(1)}" stroke-dashoffset="0"/></svg>
      <div class="iv-center"><div class="iv-phase">${IV.paused ? 'PAUSED' : label}</div><div class="iv-time num" aria-live="off"></div><div class="iv-next">${esc(next)}</div></div></div>
    <div class="iv-dots">${en.sets.map((s, i) => `<i class="${s.done ? 'on' : ''}${i === si ? ' cur' : ''}"></i>`).join('')}</div>
    ${IV.phase === 'rest' && IV.repsFor != null ? `<div class="iv-sets">${ivRepRow(IV.repsFor, true)}</div>` : ''}
    <div class="iv-ctrl"><button data-iv="pause" class="${IV.paused ? 'pri' : ''}">${ic(IV.paused ? 'play' : 'pause')} ${IV.paused ? 'Resume' : 'Pause'}</button><button data-iv="skip">${ic('skip')} Skip</button></div>`;
  updateIV();
}
function ivSetReps(si, n){
  const s = IV.en.sets[si]; s.r = n > 0 ? n : null; saveSoon();
  if(s.r && !IV.prDone[si] && isPR(s, bestFor(IV.en.exId, IV.ctx.draft))){ IV.prDone[si] = true; toast(`🏆 New PR — ${s.r} reps in ${s.t}s`); haptic([30, 50, 30]); }
}
function ivClick(e){
  const b = e.target.closest('[data-iv]'); if(!b) return;
  const k = b.dataset.iv;
  if(k === 'pause'){
    if(IV.paused){ IV.end = Date.now() + IV.left; IV.paused = false; } else { IV.left = ivRemaining(); IV.paused = true; }
    renderIV();
  }
  else if(k === 'skip') ivAdvance(true);
  else if(k === 'stop' || k === 'close') ivClose();
  else if(k === 'rep'){
    const row = b.closest('.iv-rep'), si = +row.dataset.si, s = IV.en.sets[si], d = +b.dataset.d;
    const prev = lastPerf(IV.en.exId, IV.ctx.draft), base = prev && prev[si] && prev[si].r;
    ivSetReps(si, s.r ? Math.max(0, s.r + d) : (base || (d > 0 ? 1 : 0)));
    row.querySelector('input').value = s.r || '';
  }
}
function ivInput(e){
  const row = e.target.closest('.iv-rep'); if(!row) return;
  const n = parseInt(e.target.value, 10); ivSetReps(+row.dataset.si, isNaN(n) ? 0 : n);
}
function ivClose(){
  IV.on = false;
  const el = $('#iv'); if(el) el.remove();
  saveSoon(); syncWakeLock();
  if(ui.tab === 'workout' && S.active) render();
}

/* ---------- Edit / log past workouts ---------- */
/* Log a workout after the fact (e.g. after a class), or edit a saved one.
   Every set with values is saved as completed — no ticking, timers or rest. */
function openSessionEditor(sessId, { routineId } = {}){
  const orig = sessId ? S.sessions.find(x => x.id === sessId) : null;
  const origDur = orig && sessDur(orig);
  const start = new Date(Date.now() - 45*60000); start.setSeconds(0, 0); start.setMinutes(Math.floor(start.getMinutes() / 5) * 5);
  const routine = !orig && routineId ? S.routines.find(x => x.id === routineId) : null;
  const draft = orig
    ? { id:orig.id, name:orig.name, start:orig.start, durMin: origDur ? Math.round(origDur / 60000) : null, notes:orig.notes || '', routineId:orig.routineId, entries: orig.entries.map(e => {
        const o = { exId:e.exId, name:e.name, cat:e.cat, sets:e.sets.map(s => ({ w:s.w, r:s.r, t:s.t || null, done:true })) };
        const ts = e.sets.find(s => s.t); if(ts){ o.mode = 'timed'; o.iv = { work:ts.t, rest:exIv(getEx(e.exId)).rest }; }
        return o;
      }) }
    : { id:uid(), name: routine ? routine.name : defaultName(start), start:start.toISOString(), durMin:45, notes:'', routineId: routine ? routine.id : null, entries:[] };
  if(routine) draft.entries = routine.items.filter(i => i.exId).map(i => newEntry(i.exId, draft, i.sets, i.note));
  const ctx = { draft, mode:'edit', hint: orig ? '' : `Set when you trained and for how long, then add what you did. Every set you fill in is saved as completed. Tap a <b>Previous</b> value to copy it, or use an exercise’s ⋯ menu to fill all its sets from last time.` };
  const sh = openSheet({ full:true, modal:true,
    render: () => `${sheetHead(btnClose('Cancel'), orig ? 'Edit Workout' : 'Log Finished Workout', `<button class="text-btn bold" data-a="save">Save</button>`)}<div class="sheet-body"><div class="ed-host"></div>${orig ? `<button class="btn btn-block btn-danger" style="margin-top:20px" data-a="del">Delete Workout</button>` : ''}</div>`,
    mount: s => mountEditor(s.el.querySelector('.ed-host'), ctx),
    actions: {
      save: () => {
        const entries = cleanEntries(draft.entries, true);
        if(!entries.length){ toast('Add at least one set with reps or time'); return; }
        const name = (draft.name || '').trim() || 'Workout';
        const end = draft.durMin > 0 ? new Date(new Date(draft.start).getTime() + draft.durMin*60000).toISOString() : null;
        if(new Date(draft.start) > new Date(Date.now() + 5*60000)){ toast('The start time is in the future'); return; }
        if(orig){
          Object.assign(orig, { name, start:draft.start, end, legacy: end ? false : orig.legacy, notes:(draft.notes||'').trim(), entries });
          save(); sh.close(); refresh(); toast('Workout saved');
        } else {
          const sess = { id:draft.id, name, start:draft.start, end, legacy:false, routineId:draft.routineId || null, notes:(draft.notes||'').trim(), entries };
          S.sessions.push(sess);
          save(); sh.close(); refresh(); showSummary(sess);
        }
      },
      del: () => deleteSession(orig.id, sh)
    }
  });
}
async function logFinished(){
  if(!S.routines.length) return openSessionEditor(null);
  const k = await actionSheet({ title:'Log a finished workout', actions:[{ k:'__empty', label:'Empty Workout', bold:true }, ...S.routines.map(r => ({ k:r.id, label:r.name }))] });
  if(k) openSessionEditor(null, k === '__empty' ? {} : { routineId:k });
}
async function deleteSession(id, sheet){
  if(!(await confirmDlg('Delete this workout?', 'It will be permanently removed from your history and stats.'))) return;
  S.sessions = S.sessions.filter(x => x.id !== id);
  save(); closeAllSheets(); refresh(); toast('Workout deleted');
}

/* =========================================================
   Exercise picker
   ========================================================= */
function pickExercises({ title='Add Exercises', onDone }){
  const st = { q:'', cat:'All', sel:[] };
  const headHTML = () => sheetHead(btnClose('Cancel'), title, `<button class="text-btn bold" data-a="done" ${st.sel.length ? '' : 'disabled'}>Add${st.sel.length ? ` (${st.sel.length})` : ''}</button>`);
  const rowHTML = (e, h) => {
    const n = st.sel.indexOf(e.id), last = h && h.length ? h[h.length-1].s.start : null;
    return `<button class="row tap" data-a="toggle" data-id="${esc(e.id)}"><span class="pick-dot${n >= 0 ? ' on' : ''}">${n >= 0 ? n+1 : ''}</span><div class="grow"><div class="title">${esc(e.name)}</div><div class="sub">${esc(e.cat)}${isTimedEx(e) ? ' · Timed' : ''}${last ? ' · ' + relDay(last) : ''}</div></div></button>`;
  };
  const listHTML = () => {
    const q = st.q.trim().toLowerCase(), byEx = cache().byEx;
    const items = S.exercises.filter(e => (st.cat === 'All' || e.cat === st.cat) && (!q || e.name.toLowerCase().includes(q)))
      .sort((a,b) => CATS.indexOf(a.cat) - CATS.indexOf(b.cat) || a.name.localeCompare(b.name));
    let html = '';
    if(q && !S.exercises.some(e => e.name.toLowerCase() === q))
      html += `<div class="list" style="margin-top:14px"><button class="row tap" data-a="create"><span class="pick-dot add">${ic('plus')}</span><div class="grow"><div class="title" style="color:var(--blue)">Create “${esc(st.q.trim())}”</div></div></button></div>`;
    if(!items.length) return html + (q ? '' : emptyHTML('list', 'Nothing here yet', 'Search above to create an exercise.'));
    if(st.cat === 'All' && !q){
      for(const c of CATS){ const g = items.filter(e => e.cat === c); if(g.length) html += `<div class="group-h">${c}</div><div class="list">${g.map(e => rowHTML(e, byEx[e.id])).join('')}</div>`; }
    } else html += `<div class="list" style="margin-top:14px">${items.map(e => rowHTML(e, byEx[e.id])).join('')}</div>`;
    return html;
  };
  const upd = s => { s.el.querySelector('.pick-list').innerHTML = listHTML(); s.el.querySelector('.ph').innerHTML = headHTML(); };
  openSheet({ full:true,
    render: () => `<div class="ph">${headHTML()}</div><div class="sheet-body">
      <div class="search-wrap">${ic('search')}<input class="field" type="search" placeholder="Search or create" autocomplete="off" autocorrect="off"></div>
      <div class="chips">${['All', ...CATS].map(c => `<button class="chip${c === st.cat ? ' on' : ''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}</div>
      <div class="pick-list">${listHTML()}</div></div>`,
    mount: s => { const i = s.el.querySelector('input[type=search]'); i.value = st.q; i.oninput = () => { st.q = i.value; upd(s); }; },
    actions: {
      done: (t, e, s) => { s.close(); onDone(st.sel.slice()); },
      cat: (t, e, s) => { st.cat = t.dataset.v; s.el.querySelectorAll('.chips .chip').forEach(c => c.classList.toggle('on', c.dataset.v === st.cat)); upd(s); },
      toggle: (t, e, s) => { const id = t.dataset.id, i = st.sel.indexOf(id); if(i >= 0) st.sel.splice(i, 1); else st.sel.push(id); upd(s); },
      create: (t, e, s) => openExerciseForm(null, { name:st.q.trim(), cat: st.cat !== 'All' ? st.cat : 'Other',
        onSave: ex => { st.sel.push(ex.id); st.q = ''; s.el.querySelector('input[type=search]').value = ''; upd(s); } })
    }
  });
}

/* =========================================================
   Exercise form & detail
   ========================================================= */
function openExerciseForm(ex, { name='', cat='Other', onSave }={}){
  const isNew = !ex;
  const f = { name: ex ? ex.name : name, cat: ex ? ex.cat : cat, rest: ex ? ex.rest || null : null, mode: isTimedEx(ex) ? 'timed' : 'reps', iv: exIv(ex) };
  const ivRow = (label, k, val) => `<div class="row"><span class="grow">${label}</span><div class="stepper"><button data-a="ivs" data-k="${k}" data-d="-1" aria-label="Less">−</button><span>${val}</span><button data-a="ivs" data-k="${k}" data-d="1" aria-label="More">+</button></div></div>`;
  openSheet({
    render: () => `${sheetHead(btnClose('Cancel'), isNew ? 'New Exercise' : 'Edit Exercise', `<button class="text-btn bold" data-a="save">Save</button>`)}
      <div class="sheet-body">
        <label class="lbl" for="xf-name">Name</label>
        <input class="field" id="xf-name" value="${esc(f.name)}" placeholder="e.g. Incline Dumbbell Press" autocomplete="off">
        <label class="lbl">Muscle group</label>
        <div class="chip-wrap">${CATS.map(c => `<button class="chip${c === f.cat ? ' on' : ''}" data-a="cat" data-v="${c}">${c}</button>`).join('')}</div>
        <label class="lbl">Tracking</label>
        <div class="seg lg"><button data-a="mode" data-v="reps" class="${f.mode === 'reps' ? 'on' : ''}">Reps & weight</button><button data-a="mode" data-v="timed" class="${f.mode === 'timed' ? 'on' : ''}">Timed intervals</button></div>
        ${f.mode === 'timed' ? `<div class="list" style="margin-top:12px">${ivRow('Work', 'work', fmtSecs(f.iv.work))}${ivRow('Rest', 'rest', fmtSecs(f.iv.rest))}${ivRow('Sets', 'sets', f.iv.sets)}</div>
          <div class="caption">A guided countdown runs work → rest → repeat. Reps are optional, so it suits AMRAP sets and holds like planks.</div>`
        : `<label class="lbl">Rest timer</label>
        <div class="list"><button class="row tap" data-a="rest"><span class="grow">Rest between sets</span><span class="trail">${f.rest ? fmtClock(f.rest) : `Default (${fmtClock(S.settings.rest)})`}${chev()}</span></button></div>`}
        ${!isNew ? `<button class="btn btn-block btn-danger" style="margin-top:28px" data-a="del">${ic('trash')} Delete Exercise</button>` : ''}
      </div>`,
    mount: s => { const i = s.el.querySelector('#xf-name'); i.oninput = () => { f.name = i.value; }; if(isNew && !f.name) setTimeout(() => i.focus(), 380); },
    actions: {
      cat: (t, e, s) => { f.cat = t.dataset.v; s.el.querySelectorAll('.chip-wrap .chip').forEach(c => c.classList.toggle('on', c.dataset.v === f.cat)); },
      rest: async (t, e, s) => { const r = await chooseRest('Rest between sets', true); if(r == null) return; f.rest = r === 'default' ? null : r; s.rerender(); },
      mode: (t, e, s) => { f.mode = t.dataset.v; s.rerender(); },
      ivs: (t, e, s) => {
        const k = t.dataset.k, d = +t.dataset.d;
        if(k === 'sets') f.iv.sets = Math.max(1, Math.min(20, f.iv.sets + d));
        else if(k === 'work') f.iv.work = Math.max(5, Math.min(600, f.iv.work + d*5));
        else f.iv.rest = Math.max(0, Math.min(600, f.iv.rest + d*5));
        s.rerender();
      },
      save: (t, e, s) => {
        const n = f.name.trim();
        if(!n){ toast('Give the exercise a name'); return; }
        if(S.exercises.some(x => x !== ex && x.name.toLowerCase() === n.toLowerCase())){ toast('You already have an exercise with that name'); return; }
        let obj;
        if(isNew){ obj = { id:uid(), name:n, cat:f.cat }; if(f.rest) obj.rest = f.rest; S.exercises.push(obj); }
        else {
          obj = ex; obj.name = n; obj.cat = f.cat;
          if(f.rest) obj.rest = f.rest; else delete obj.rest;
          S.sessions.forEach(ss => ss.entries.forEach(en => { if(en.exId === ex.id){ en.name = n; en.cat = f.cat; } }));
          if(S.active) S.active.entries.forEach(en => { if(en.exId === ex.id){ en.name = n; en.cat = f.cat; } });
        }
        if(f.mode === 'timed'){ obj.mode = 'timed'; obj.iv = { ...f.iv }; } else delete obj.mode;
        save(); s.close(); refresh();
        toast(isNew ? `Added ${n}` : 'Exercise updated');
        if(onSave) onSave(obj);
      },
      del: async (t, e, s) => {
        if(!(await confirmDlg(`Delete ${ex.name}?`, 'It’s removed from your library and routines. Past workouts keep their history.'))) return;
        S.exercises = S.exercises.filter(x => x.id !== ex.id);
        S.routines.forEach(r => { r.items = r.items.filter(i => i.exId !== ex.id); });
        save(); s.close(); refresh(); toast('Exercise deleted');
      }
    }
  });
}

function exSeries(id){
  return (cache().byEx[id] || []).map(({ s, e }) => {
    const b = entryBest(e.sets), rs = e.sets.filter(x => !x.t), ts = e.sets.filter(x => x.t);
    return { x:+new Date(s.start), id:s.id, e1:b.e, top:b.w, topR:b.wr, vol:e.sets.reduce((a,x) => a + x.w*x.r, 0), reps:b.r, treps:rs.reduce((a,x) => a + x.r, 0),
      hasReps:rs.length > 0, timed:ts.length > 0, tb:b.tb ? b.tb.r : 0, tbT:b.tb ? b.tb.t : 0, ttot:ts.reduce((a,x) => a + x.r, 0), time:ts.reduce((a,x) => a + x.t, 0), hold:b.hold,
      sets:e.sets, start:s.start };
  });
}
/* Picks which stats/metrics an exercise's detail view shows. */
function exView(id){
  const ex = getEx(id), ser = exSeries(id);
  const hasTimed = ser.some(p => p.timed), hasReps = ser.some(p => p.hasReps);
  const timed = hasTimed && (!hasReps || isTimedEx(ex));
  const tReps = ser.some(p => p.tb > 0);
  const bw = !timed && ser.length > 0 && ser.every(p => p.top === 0);
  const metrics = timed ? (tReps ? [['tb','Best set'], ['ttot','Total reps'], ['time','Work time']] : [['hold','Longest hold'], ['time','Work time']])
    : bw ? [['reps','Most reps'], ['treps','Total reps']] : [['e1','Est. 1RM'], ['top','Heaviest'], ['vol','Volume']];
  if(!metrics.some(m => m[0] === ui.exMetric)) ui.exMetric = metrics[0][0];
  return { ex, ser, timed, tReps, bw, metrics };
}
function openExerciseDetail(id){
  openSheet({ live:true, full:true,
    render: () => {
      const { ex, ser, timed, tReps, bw, metrics } = exView(id), b = cache().best[id];
      const last = ser[ser.length-1];
      let body;
      if(!ser.length) body = emptyHTML('chart', 'No history yet', 'Log this exercise in a workout and your progress will show up here.');
      else {
        const bestVol = ser.reduce((m, p) => p.vol > m.vol ? p : m, ser[0]);
        const tTime = ser.reduce((a,p) => a + p.time, 0);
        body = timed ? `<div class="tiles">
            ${tReps ? tile('Best set', b.tb.r + '<small>reps</small>', `in ${fmtSecs(b.tb.t)}`) : tile('Longest hold', fmtSecs(b.hold), 'in one set')}
            ${tile('Workouts', ser.length, 'last ' + relPhrase(last.start))}
            ${tile('Work time', tTime < 3600 ? fmtClock(tTime) : fmtDurShort(tTime*1000), 'all time')}
            ${tReps ? tile('Total reps', ser.reduce((a,p) => a + p.ttot, 0).toLocaleString(), 'all time') : tile('Sets', ser.reduce((a,p) => a + p.sets.length, 0), 'all time')}
          </div>` : `<div class="tiles">
            ${bw ? tile('Most reps', b.r, 'in one set') : tile('Heaviest', fmtW(b.w) + `<small>${U()}</small>`, `× ${plural(b.wr,'rep')}`)}
            ${bw ? tile('Total reps', ser.reduce((a,p) => a + p.treps, 0).toLocaleString(), 'all time') : tile('Est. 1RM', fmtW1(b.e) + `<small>${U()}</small>`, `from ${fmtW(b.eW)} × ${b.eR}`)}
            ${tile('Workouts', ser.length, 'last ' + relPhrase(last.start))}
            ${bw ? tile('Sets', ser.reduce((a,p) => a + p.sets.length, 0), 'all time') : tile('Best volume', fmtCompact(bestVol.vol) + `<small>${U()}</small>`, relDay(bestVol.start))}
          </div>`;
        body += `<div class="card" style="margin-top:12px">
            <div class="seg" style="margin-bottom:14px">${metrics.map(([k, l]) => `<button data-a="metric" data-v="${k}" class="${ui.exMetric === k ? 'on' : ''}">${l}</button>`).join('')}</div>
            <div class="chart" id="ex-chart"></div>
            <div class="small faint" style="margin-top:6px">Each point is one workout. Tap or drag to inspect.</div>
          </div>
          <div class="group-h">Recent workouts</div>
          <div class="list">${ser.slice(-15).reverse().map(p => `<button class="row tap" data-a="sess" data-id="${esc(p.id)}"><div class="grow"><div class="title" style="font-size:15px;font-weight:600">${new Date(p.start).toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' })}</div><div class="sub wrap num">${p.sets.map(x => setStr(x)).join(' · ')}</div></div>${chev()}</button>`).join('')}</div>`;
      }
      return `${sheetHead(btnClose(), '', ex.deleted ? '' : `<button class="text-btn" data-a="edit">Edit</button>`)}
        <div class="sheet-body">
          <h2 class="sheet-h1">${esc(ex.name)}</h2>
          <div class="meta-row"><span class="tag">${esc(ex.cat)}</span>${ex.deleted ? '<span class="small muted">Removed from library</span>' : isTimedEx(ex) ? `<span class="small muted">${ic('timer')} ${fmtSecs(exIv(ex).work)} on · ${fmtSecs(exIv(ex).rest)} off · ${plural(exIv(ex).sets, 'set')}</span>` : `<span class="small muted">${ic('timer')} Rest ${fmtClock(restFor(id))}</span>`}</div>
          ${body}
        </div>`;
    },
    mount: s => {
      const el = s.el.querySelector('#ex-chart'); if(!el) return;
      const { ser } = exView(id), m = ui.exMetric;
      const isW = m === 'e1' || m === 'top' || m === 'vol', isT = m === 'time' || m === 'hold', timedM = isT || m === 'tb' || m === 'ttot';
      const pts = ser.filter(p => timedM ? p.timed : p.hasReps);
      lineChart(el, pts.map(p => ({ x:p.x, y: isW ? toDisp(p[m]) : p[m], sub: m === 'top' ? `× ${p.topR} reps` : m === 'tb' ? `in ${p.tbT}s` : '' })), {
        fmt: v => isW ? (m === 'vol' ? Math.round(v).toLocaleString() : fmtNum(v, 1)) + ' ' + U() : isT ? fmtSecs(Math.round(v)) : Math.round(v) + ' reps'
      });
    },
    actions: {
      metric: (t, e, s) => { ui.exMetric = t.dataset.v; s.rerender(); },
      edit: () => openExerciseForm(getEx(id)),
      sess: t => openSession(t.dataset.id)
    }
  });
}

    actions: {

      'item-menu': async (t, e, s) => {
        const i = +t.dataset.i, acts = [];

        if(i < d.items.length-1) acts.push({ k:'down', label:'Move Down' });
        acts.push({ k:'note', label:d.items[i].note ? 'Edit Coach Note' : 'Add Coach Note' });
        acts.push({ k:'rm', label:'Remove', red:true });
        const k = await actionSheet({ title:getEx(d.items[i].exId).name, actions:acts });
        if(k === 'note'){
          const v = await promptDlg('Coach note', 'Shown on this exercise during the workout, e.g. “5 reps at RPE 7”.', d.items[i].note || '', 'Target or cue');
          if(v == null) return;
          if(v.trim()) d.items[i].note = v.trim().slice(0, 120); else delete d.items[i].note;
          s.rerender(); return;
        }
        if(k === 'up') [d.items[i-1], d.items[i]] = [d.items[i], d.items[i-1]];
        else if(k === 'down') [d.items[i+1], d.items[i]] = [d.items[i], d.items[i+1]];
        else if(k === 'rm') d.items.splice(i, 1);
        else return;
        s.rerender();
      },
      add: (t, e, s) => pickExercises({ onDone: ids => { ids.forEach(id => d.items.push({ exId:id, sets: Math.min(12, (lastPerf(id) || []).length || 3) })); s.rerender(); } }),
      save: (t, e, s) => {
        const name = d.name.trim();

        if(r){ r.name = name; r.items = d.items; } else S.routines.push({ id:uid(), name, items:d.items });
        save(); s.close(); refresh(); toast(r ? 'Routine updated' : `Routine “${name}” created`);
      },

        if(!(await confirmDlg(`Delete “${r.name}”?`, 'Workouts you’ve already logged from it are kept.'))) return;
        S.routines = S.routines.filter(x => x.id !== r.id);
        save(); s.close(); refresh(); toast('Routine deleted');
      }
    }
  });

async function routineMenu(id){
  const r = S.routines.find(x => x.id === id); if(!r) return;
  const k = await actionSheet({ title:r.name, actions:[{ k:'start', label:'Start Workout', bold:true }, { k:'log', label:'Log as Finished Workout' }, { k:'edit', label:'Edit Routine' }, { k:'dup', label:'Duplicate' }, { k:'del', label:'Delete Routine', red:true }] });
  if(k === 'start') startRoutine(id);
  else if(k === 'log') openSessionEditor(null, { routineId:id });
  else if(k === 'edit') openRoutineEditor(id);
  else if(k === 'dup'){ S.routines.splice(S.routines.indexOf(r)+1, 0, { id:uid(), name:r.name + ' (copy)', items:r.items.map(i => ({ ...i })) }); save(); refresh(); }
  else if(k === 'del'){
    if(!(await confirmDlg(`Delete “${r.name}”?`, 'Workouts you’ve already logged from it are kept.'))) return;
    S.routines = S.routines.filter(x => x.id !== id); save(); refresh(); toast('Routine deleted');
  }
}

function renderHistory(){

  const monthKey = d => d.toLocaleDateString(undefined, { month:'long', year:'numeric' });

  const countText = n => [n.w ? plural(n.w,'workout') : '', n.c ? `${n.c} cardio` : ''].filter(Boolean).join(' · ');

function calendarHTML(){
  const m = ui.calMonth, y = m.getFullYear(), mo = m.getMonth(), now = new Date();

  for(let d = 1; d <= days; d++){

    <div class="card">${gList.length ? gList.map(([c, n]) => `<div class="hbar"><span>${esc(c)}</span><div class="track"><div class="fill" style="width:${(n/gMax*100).toFixed(1)}%"></div></div><span class="val">${n}</span></div>`).join('') : '<div class="small muted">No sets logged in the last 30 days.</div>'}</div>
    <div class="section-h"><h2>Top lifts</h2><button class="link" data-a="tab" data-tab="exercises">All</button></div>
    <div class="list">${top.map(t => { const ex = getEx(t.id); return `<button class="row tap" data-a="ex" data-id="${esc(t.id)}"><div class="grow"><div class="title">${esc(ex.name)}</div><div class="sub">${t.b.w ? `Best ${fmtW(t.b.w)} ${U()} × ${t.b.wr} · e1RM ${fmtW1(t.b.e)}` : bestLabel(t.b) ? 'Best ' + bestLabel(t.b) : ''}</div></div><span class="trail num">${plural(t.n,'workout')}${chev()}</span></button>`; }).join('')}</div>`;

  const ws = startOfWeek(now), weeks = [];
  for(let i = 11; i >= 0; i--){
    const a = addDays(ws, -7*i), b = addDays(a, 7);
    const w = weekStats(Math.round((ws - a) / (7*864e5)));
    const parts = [{ v:w.liftSec/3600, c:WK_COLORS.lift, label:'Workouts' }, { v:w.cardioSec/3600, c:WK_COLORS.cardio, label:'Cardio' }];
    weeks.push({ label: i === 0 ? 'This wk' : a.toLocaleDateString(undefined, { day:'numeric', month:'short' }), tip: i === 0 ? 'This week' : 'Week of ' + a.toLocaleDateString(undefined, { day:'numeric', month:'short' }), value:w.time/3600, parts });
  }
  barChart($('#wk-chart'), weeks, { fmt: v => fmtTrained(v*3600), aria:'Weekly time trained bar chart' });
}

/* Weekly time trained: lifting in the accent colour, cardio in teal. */
const WK_COLORS = { lift:'#d4af37', cardio:'#66d4cf' };  // gym accent + teal
/* ---------- Charts (inline SVG, single hue, hover/tap tooltips) ---------- */
function niceScale(min, max, n=4){
  if(min === max){ min = Math.max(0, min - 1); max = max + 1; }
  const step0 = (max - min) / (n - 1), mag = 10 ** Math.floor(Math.log10(step0)), norm = step0 / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = [];
  for(let v = lo; v <= hi + step*1e-6; v += step) ticks.push(Math.round(v * 1e6) / 1e6);
  return [lo, hi, ticks];
}
const fmtAxis = v => v >= 1000 ? fmtNum(v/1000, v >= 100000 ? 0 : 1) + 'k' : fmtNum(v, 1);
const shortDate = x => new Date(x).toLocaleDateString(undefined, { day:'numeric', month:'short' });
function lineChart(el, pts, { fmt, ring = 'var(--card-2)', color = ACCENT, axis = fmtAxis, invert = false }){
  if(!pts.length){ el.innerHTML = '<div class="chart-empty">No data yet</div>'; return; }
  const W = el.clientWidth || 320, H = el.clientHeight || 190;
  const L = 6, R = 46, T = 30, B = 22;
  let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
  if(x1 === x0){ x0 -= 864e5; x1 += 864e5; }
  const [y0, y1, ticks] = niceScale(Math.min(...pts.map(p => p.y)), Math.max(...pts.map(p => p.y)));
  const X = x => L + (x - x0) / (x1 - x0) * (W - L - R);
  const Y = y => T + (invert ? y - y0 : y1 - y) / ((y1 - y0) || 1) * (H - T - B);
  const gid = 'lg' + uid();
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
  const area = pts.length > 1 ? `${line}L${X(pts[pts.length-1].x).toFixed(1)},${H-B}L${X(pts[0].x).toFixed(1)},${H-B}Z` : '';
  const last = pts[pts.length-1];
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart">
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="${invert ? 1 : 0}" y2="${invert ? 0 : 1}"><stop offset="0" stop-color="${color}" stop-opacity=".28"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${ticks.map(t => `<line x1="${L}" x2="${W-R+6}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="rgba(255,255,255,.08)"/><text class="ax" x="${W-R+10}" y="${(Y(t)+4).toFixed(1)}">${axis(t)}</text>`).join('')}
    <text class="ax" x="${L}" y="${H-5}">${shortDate(pts[0].x)}</text>
    ${pts.length > 1 ? `<text class="ax" x="${W-R}" y="${H-5}" text-anchor="end">${shortDate(last.x)}</text>` : ''}
    ${area ? `<path d="${area}" fill="url(#${gid})"/>` : ''}
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.length <= 40 ? pts.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.5" fill="${color}" stroke="${ring}" stroke-width="2"/>`).join('') : ''}
    <circle cx="${X(last.x).toFixed(1)}" cy="${Y(last.y).toFixed(1)}" r="5" fill="${color}" stroke="${ring}" stroke-width="2"/>
    <g class="hover" style="display:none"><line y1="${T-6}" y2="${H-B}" stroke="rgba(255,255,255,.35)" stroke-dasharray="3 3"/><circle r="6" fill="${color}" stroke="#fff" stroke-width="2"/></g>
  </svg><div class="tip"></div>`;
  const g = el.querySelector('.hover'), tip = el.querySelector('.tip');
  const show = cx => {
    let best = pts[0], bd = Infinity;
    for(const p of pts){ const d = Math.abs(X(p.x) - cx); if(d < bd){ bd = d; best = p; } }
    const px = X(best.x), py = Y(best.y);
    g.style.display = ''; g.querySelector('line').setAttribute('x1', px); g.querySelector('line').setAttribute('x2', px);
    g.querySelector('circle').setAttribute('cx', px); g.querySelector('circle').setAttribute('cy', py);
    tip.innerHTML = `<b>${esc(fmt(best.y))}</b>${shortDate(best.x)}${best.sub ? ' · ' + esc(best.sub) : ''}`;
    tip.style.left = Math.min(W - 60, Math.max(60, px)) + 'px'; tip.classList.add('show');
  };
  const hide = () => { g.style.display = 'none'; tip.classList.remove('show'); };
  el.onpointermove = el.onpointerdown = e => show(e.clientX - el.getBoundingClientRect().left);
  el.onpointerleave = hide;
}
function barChart(el, bars, { fmt, aria = 'Weekly volume bar chart', color = ACCENT }){
  const W = el.clientWidth || 320, H = el.clientHeight || 190;
  const L = 2, R = 44, T = 30, B = 22;
  const [, y1, ticks] = niceScale(0, Math.max(1, ...bars.map(b => b.value)));
  const n = bars.length, bw = (W - L - R) / n, w = Math.max(4, bw - 6);
  const Y = v => T + (1 - v / y1) * (H - T - B);
  const base = H - B;
  const barPath = (x, y, b = base) => { const h = b - y, r = Math.min(4, h, w/2); return `M${x},${b}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${b}Z`; };
  /* Stacked bars: segments bottom-up with a 2px gap; only the top one is rounded. */
  const barSVG = (b, x) => {
    const parts = (b.parts || [{ v:b.value, c:color }]).filter(p => p.v > 0); let acc = 0;
    return parts.map((p, j) => {
      const yb = j ? Y(acc) - 2 : base, yt = Y(acc += p.v);
      if(yb - yt < .5) return '';
      return j === parts.length - 1 ? `<path d="${barPath(x, yt, yb)}" fill="${p.c}"/>` : `<rect x="${x}" y="${yt.toFixed(1)}" width="${w}" height="${(yb - yt).toFixed(1)}" fill="${p.c}"/>`;
    }).join('');
  };
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">
    ${ticks.map(t => `<line x1="${L}" x2="${W-R+6}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="rgba(255,255,255,${t === 0 ? .2 : .08})"/><text class="ax" x="${W-R+10}" y="${(Y(t)+4).toFixed(1)}">${fmtAxis(t)}</text>`).join('')}
    ${bars.map((b, i) => { const x = L + i*bw + (bw - w)/2; return (b.value > 0 ? `<g fill-opacity="${i === n-1 ? 1 : .55}" data-i="${i}">${barSVG(b, x)}</g>` : '') + ((i % 3 === 2 || i === n-1) && (i === n-1 || i < n-2) ? `<text class="ax" x="${(x + w/2).toFixed(1)}" y="${H-5}" text-anchor="middle">${esc(b.label)}</text>` : ''); }).join('')}
  </svg><div class="tip"></div>`;
  const tip = el.querySelector('.tip'), paths = el.querySelectorAll('[data-i]');
  const show = cx => {
    const i = Math.max(0, Math.min(n-1, Math.floor((cx - L) / bw))), b = bars[i];
    paths.forEach(p => p.setAttribute('fill-opacity', +p.dataset.i === i ? 1 : .35));
    const parts = (b.parts || []).filter(p => p.v > 0);
    tip.innerHTML = `<b>${esc(fmt(b.value))}</b>${esc(b.tip)}${parts.length > 1 ? parts.map(p => `<span class="tp"><i style="background:${p.c}"></i>${esc(p.label)} ${esc(fmt(p.v))}</span>`).join('') : ''}`;
    tip.style.left = Math.min(W - 60, Math.max(60, L + i*bw + bw/2)) + 'px'; tip.classList.add('show');
  };
  const hide = () => { tip.classList.remove('show'); paths.forEach(p => p.setAttribute('fill-opacity', +p.dataset.i === n-1 ? 1 : .55)); };
  el.onpointermove = el.onpointerdown = e => show(e.clientX - el.getBoundingClientRect().left);
  el.onpointerleave = hide;
}

const dsIso = ds => new Date(dateMs(ds)).toISOString();
const fmtDay = ds => new Date(dateMs(ds)).toLocaleDateString(undefined, { day:'numeric', month:'short', year: ds.slice(0, 4) !== String(new Date().getFullYear()) ? 'numeric' : undefined });
const fmtMetricU = (m, v) => fmtMetric(m, v) + (m.kind === 'pct' ? '%' : ' ' + metricUnit(m));
const entriesWord = n => `${n} ${n === 1 ? 'entry' : 'entries'}`;
function metricSeries(k){
  return S.body.entries.filter(e => e[k] != null).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0).map(e => ({ date:e.date, v:e[k] }));
}
/* Change from the earliest entry in the last 30 days (or the previous entry). */
function metricChange(ser){
  if(ser.length < 2) return null;
  const last = ser[ser.length-1], cutoff = dateMs(last.date) - 30*864e5;
  let base = ser.find(p => dateMs(p.date) >= cutoff);
  if(!base || base === last) base = ser[ser.length-2];
  return { d:last.v - base.v, since:base.date };
}
function signedMetric(m, d){ const v = mToDisp(m, d); return (v > 0.049 ? '+' : v < -0.049 ? '−' : '') + fmtNum(Math.abs(v), 1); }
function changeText(m, ch, short){
  if(!ch) return '';
  const v = mToDisp(m, ch.d);
  if(Math.abs(v) < 0.05) return `No change since ${fmtDay(ch.since)}`;
  const unit = short ? '' : m.kind === 'pct' ? '%' : ' ' + metricUnit(m);
  return `${v > 0 ? '▲' : '▼'} ${fmtNum(Math.abs(v), 1)}${unit} since ${fmtDay(ch.since)}`;
}
function bmi(){ const h = S.body.height, w = metricSeries('weight').pop(); return h && w ? w.v / ((h/100) ** 2) : null; }
function sparkSVG(ser){
  if(ser.length < 2) return '';
  const W = 56, H = 22, xs = ser.map(p => dateMs(p.date)), ys = ser.map(p => p.v);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = x => 2 + (x - x0) / ((x1 - x0) || 1) * (W - 4), Y = y => 2 + (1 - (y - y0) / ((y1 - y0) || 1)) * (H - 4);
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline fill="none" stroke="${ACCENT}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${ser.map(p => X(dateMs(p.date)).toFixed(1) + ',' + Y(p.v).toFixed(1)).join(' ')}"/></svg>`;
}
function bodyNudge(){
  const days = REMIND_DAYS[S.settings.bodyRemind];
  if(!days || !S.body.track.includes('weight') || !(S.sessions.length || S.cardio.length)) return '';
  const last = metricSeries('weight').pop(), now = Date.now();
  if(last && now - dateMs(last.date) < days*864e5) return '';

  return `<div class="nudge"><div class="ico" style="background:rgba(191,90,242,.18);color:var(--purple)">${ic('scale')}</div><div class="grow"><div class="t">${last ? 'Time to log your weight' : 'Log your starting weight'}</div><div class="s">${last ? 'Last logged ' + relPhrase(dsIso(last.date)) : 'See your trend in Progress → Body'}</div></div><button class="btn btn-sm btn-tinted" data-a="body-log">Log</button><button class="btn-icon" style="background:none;color:var(--label-3)" data-a="body-nudge-x" aria-label="Dismiss">${ic('x')}</button></div>`;
}

  v.innerHTML = html;
  const el = $('#body-w-chart');
  if(el) lineChart(el, wSer.map(p => ({ x:dateMs(p.date), y:mToDisp(wM, p.v) })), { fmt: x => fmtNum(x, 1) + ' ' + U(), ring:'var(--card)' });
}
function openMetric(k){
  const m = BODY_METRICS.find(x => x.k === k); if(!m) return;
  openSheet({ live:true, full:true,
    render: () => {

      const last = ser[ser.length-1], first = ser[0], ch = metricChange(ser), unit = `<small>${metricUnit(m)}</small>`;

function openBodyLog(date, focusK){
  const today = dayKey(new Date());
  const st = { date: date || today, vals:{}, touched:new Set(), existing:null };
  const load = () => {
    st.existing = S.body.entries.find(e => e.date === st.date) || null;
    st.vals = {}; st.touched = new Set();
    if(st.existing) BODY_METRICS.forEach(m => { if(st.existing[m.k] != null) st.vals[m.k] = fmtMetric(m, st.existing[m.k]); });
  };
  load();
  const fields = () => BODY_METRICS.filter(m => S.body.track.includes(m.k) || m.k === focusK || (st.existing && st.existing[m.k] != null));
  openSheet({
    render: () => `${sheetHead(btnClose('Cancel'), st.existing ? 'Edit Measurements' : 'Log Measurements', `<button class="text-btn bold" data-a="save">Save</button>`)}
      <div class="sheet-body">
        <label class="lbl" for="bl-date">Date</label>
        <input class="field" type="date" id="bl-date" value="${st.date}" max="${today}">
        ${st.existing && st.date !== date ? `<div class="caption" style="margin:8px 4px 0">You already logged on this day — saving updates that entry.</div>` : ''}
        <div class="list" style="margin-top:16px">${fields().map(m => { const latest = metricSeries(m.k).pop(); return `<label class="row"><span class="grow">${m.label}</span><input class="body-in num" data-k="${m.k}" inputmode="decimal" autocomplete="off" value="${esc(st.vals[m.k] || '')}" placeholder="${latest ? fmtMetric(m, latest.v) : '–'}" aria-label="${m.label} in ${metricUnit(m)}"><span class="body-unit">${metricUnit(m)}</span></label>`; }).join('')}</div>
        <div class="caption">Fill in whatever you measured — every field is optional.${S.body.track.length < BODY_METRICS.length ? ' Track more in <b>Choose what to track</b>.' : ''}</div>
        ${st.existing ? `<button class="btn btn-block btn-danger" style="margin-top:24px" data-a="del">${ic('trash')} Delete This Entry</button>` : ''}
      </div>`,
    mount: s => {
      const d = s.el.querySelector('#bl-date');
      d.onchange = () => {
        st.date = d.value && d.value <= today ? d.value : today;
        if(S.body.entries.some(e => e.date === st.date)) load(); else st.existing = null;
        s.rerender();
      };
      s.el.querySelectorAll('.body-in').forEach(i => { i.oninput = () => { st.vals[i.dataset.k] = i.value; st.touched.add(i.dataset.k); }; });
    },
    actions: {
      save: (t, e, s) => {
        const vals = {};
        for(const k of st.touched){
          const m = BODY_METRICS.find(x => x.k === k), raw = String(st.vals[k] ?? '').trim();
          if(raw === ''){ vals[k] = null; continue; }
          const n = toNum(raw);
          if(!(n > 0) || (m.kind === 'pct' && n >= 100)){ toast(`Check the value for ${m.label.toLowerCase()}`); return; }
          vals[k] = mFromDisp(m, n);
        }
        const entry = S.body.entries.find(x => x.date === st.date);
        const merged = { ...(entry || { id:uid(), date:st.date }) };
        for(const k in vals){ if(vals[k] == null) delete merged[k]; else merged[k] = vals[k]; }
        if(!BODY_METRICS.some(m => merged[m.k] != null)){

/* =========================================================
   Cardio — runs, walks, hikes and rides logged after the fact
   (Progress → Cardio). Distances are stored in km, time in seconds,
   elevation in metres; pace is derived (sec per km).
   ========================================================= */
const MI = 1.609344;
const CTYPES = ['run','walk','hike','cycle'];
const CT = {
  run:  { label:'Run',  pick:'Run',   noun:'run',  ing:'running', icon:'run',  c:'#0a84ff', indoor:'Treadmill' },
  walk: { label:'Walk', pick:'Walk',  noun:'walk', ing:'walking', icon:'walk', c:'#66d4cf', indoor:'Treadmill' },
  hike: { label:'Hike', pick:'Hike',  noun:'hike', ing:'hiking',  icon:'hike', c:'#d4a373', indoor:'' },
  cycle:{ label:'Ride', pick:'Cycle', noun:'ride', ing:'cycling', icon:'bike', c:'#ff6482', indoor:'Indoor / trainer', speed:true }
};
/* Stack order for the weekly chart: keeps the pairs that are hardest to tell apart with colour blindness from touching. */
const STACK = ['run','hike','walk','cycle'];
const EFFORT = [null, { label:'Easy', c:'#30d158' }, { label:'Moderate', c:'#ffd60a' }, { label:'Hard', c:'#ff9f0a' }, { label:'Max', c:'#ff453a' }];
const soft = (hex, a=.18) => `rgba(${[1,3,5].map(i => parseInt(hex.slice(i, i+2), 16)).join(',')},${a})`;
const DU = () => S.settings.distUnit || (U() === 'lb' ? 'mi' : 'km');
const toDist = km => DU() === 'mi' ? km / MI : km;
const fromDist = v => DU() === 'mi' ? v * MI : v;
const fmtDist = km => fmtNum(toDist(km), toDist(km) >= 100 ? 1 : 2);
const EU = () => DU() === 'mi' ? 'ft' : 'm';
const toElev = m => DU() === 'mi' ? m / 0.3048 : m;
const fromElev = v => DU() === 'mi' ? v * 0.3048 : v;
const PU = () => '/' + DU();
const SU = () => DU() === 'mi' ? 'mph' : 'km/h';
const paceOf = a => a.dist > 0 && a.dur > 0 ? a.dur / a.dist : null;            // sec per km
const speedOf = a => a.dist > 0 && a.dur > 0 ? a.dist / (a.dur / 3600) : null;   // km/h
const fmtPace = spk => fmtClock(spk * (DU() === 'mi' ? MI : 1));
const fmtSpeed = kmh => fmtNum(toDist(kmh), 1);
const fmtHMS = sec => fmtDur(sec * 1000);
function rateParts(a){
  if(CT[a.type].speed){ const v = speedOf(a); return v ? { v:fmtSpeed(v), u:SU() } : null; }
  const p = paceOf(a); return p ? { v:fmtPace(p), u:PU() } : null;
}
function partOfDay(d){ const h = d.getHours(); return h<5?'Night':h<12?'Morning':h<17?'Afternoon':h<21?'Evening':'Night'; }
const cardioName = a => `${partOfDay(new Date(a.start))} ${CT[a.type].label}`;
const actWord = n => n === 1 ? '1 activity' : `${n} activities`;
const cico = (type, cls='') => `<span class="cico ${cls}" style="--c:${CT[type].c};--cs:${soft(CT[type].c)}">${ic(CT[type].icon)}</span>`;
const effChip = k => EFFORT[k] ? `<span class="eff" style="--c:${EFFORT[k].c};--cs:${soft(EFFORT[k].c, .16)}"><span class="lv">${[1,2,3,4].map(i => `<i class="${i <= k ? 'on' : ''}"></i>`).join('')}</span>${EFFORT[k].label}</span>` : '';

function normCardio(list){
  const num = (v, lo, hi) => { v = +v; return v > lo && v <= hi ? v : null; };
  return (Array.isArray(list) ? list : []).filter(a => a && a.id && a.start && CT[a.type] && !isNaN(new Date(a.start))).map(a => {
    const o = { id:String(a.id), type:a.type, start:a.start };
    const dist = num(a.dist, 0, 2000), dur = num(a.dur, 0, 172800), hr = num(a.hr, 0, 260), elev = num(a.elev, 0, 15000), cal = num(a.cal, 0, 30000);
    if(dist) o.dist = dist; if(dur) o.dur = Math.round(dur);
    if([1,2,3,4].includes(+a.effort)) o.effort = +a.effort;
    if(hr) o.hr = Math.round(hr); if(elev) o.elev = Math.round(elev); if(cal) o.cal = Math.round(cal);
    if(a.indoor && CT[a.type].indoor) o.indoor = true;
    if(a.notes) o.notes = String(a.notes);
    return o;
  }).filter(a => a.dist || a.dur);
}

/* Records per type. Treadmill/indoor sessions count toward distance but not pace or speed. */
function cardioRecKinds(a){
  const out = [], fair = !a.indoor;
  if(a.dist > 0) out.push(['dist', a.dist, 1]);
  if(fair && a.dist >= 1 && a.dur > 0 && a.type !== 'hike') out.push(CT[a.type].speed ? ['speed', speedOf(a), 1] : ['pace', paceOf(a), -1]);
  if(a.type === 'run' && fair && a.dur > 0){
    if(a.dist >= 5) out.push(['k5', a.dur * 5 / a.dist, -1]);
    if(a.dist >= 10) out.push(['k10', a.dur * 10 / a.dist, -1]);
  }
  if(a.type === 'hike' && a.elev > 0) out.push(['elev', a.elev, 1]);
  return out;
}
function cardioCache(){
  const c = cache(); if(c.cardio) return c.cardio;
  const sorted = S.cardio.slice().sort((a, b) => new Date(a.start) - new Date(b.start));
  const prs = {}, best = {};
  for(const a of sorted){
    const b = best[a.type] = best[a.type] || {}, list = [];
    for(const [kind, v, dir] of cardioRecKinds(a)){
      const cur = b[kind], better = !cur || (dir > 0 ? v > cur.v + 1e-9 : v < cur.v - 1e-9);
      if(cur && better) list.push({ kind, v });
      if(better) b[kind] = { v, id:a.id };
    }
    if(list.length) prs[a.id] = list;
  }
  return (c.cardio = { sorted, prs, best });
}
function cardioRecText(kind, v, type){
  const t = CT[type];
  return ({
    dist: { label:`Longest ${t.noun}`, text:`${fmtDist(v)} ${DU()}` },
    pace: { label:'Fastest pace', text:`${fmtPace(v)} ${PU()}` },
    speed:{ label:'Fastest avg. speed', text:`${fmtSpeed(v)} ${SU()}` },
    k5:   { label:'Fastest 5K', text:fmtHMS(Math.round(v)) },
    k10:  { label:'Fastest 10K', text:fmtHMS(Math.round(v)) },
    elev: { label:'Most climbing', text:`${Math.round(toElev(v)).toLocaleString()} ${EU()}` }
  })[kind];
}
function bestWeek(type){
  const m = {};
  S.cardio.forEach(a => { if(a.type === type && a.dist > 0){ const k = +startOfWeek(new Date(a.start)); m[k] = (m[k] || 0) + a.dist; } });
  let best = null; for(const k in m) if(!best || m[k] > best.v) best = { v:m[k], w:+k };
  return best;
}
const sumDist = list => list.reduce((x, a) => x + (a.dist || 0), 0);

/* ---------- History card & detail ---------- */

/* ---------- Log / edit form ----------
   Distance, time and pace (or speed for rides): fill in any two and the third
   is worked out. A field the app filled in is "auto" and gets replaced first. */
function cfRead(st){
  const km = toNum(st.dist) > 0 ? fromDist(toNum(st.dist)) : 0;
  const dur = (st.h + st.m + st.s).trim() ? (toNum(st.h) || 0)*3600 + (toNum(st.m) || 0)*60 + (toNum(st.s) || 0) : 0;
  let rate = 0;
  if(CT[st.type].speed){ const v = toNum(st.spd); rate = v > 0 ? fromDist(v) : 0; }
  else if((st.pm + st.ps).trim()){ const sec = (toNum(st.pm) || 0)*60 + (toNum(st.ps) || 0); rate = sec > 0 ? sec / (DU() === 'mi' ? MI : 1) : 0; }
  return { km, dur, rate };
}
const CF_GROUP = { dist:'dist', h:'time', m:'time', s:'time', pm:'pace', ps:'pace', spd:'pace' };
function cfSet(st, el, g, val){
  const put = (f, v) => { st[f] = v; const i = el && el.querySelector(`[data-f="${f}"]`); if(i){ i.value = v; i.classList.add('auto'); } };
  if(g === 'dist') put('dist', val ? fmtNum(toDist(val), 2) : '');
  else if(g === 'time'){
    const t = val ? Math.round(val) : 0;
    put('h', t >= 3600 ? String(Math.floor(t/3600)) : ''); put('m', t ? (t >= 3600 ? pad(Math.floor(t%3600/60)) : String(Math.floor(t/60))) : ''); put('s', t ? pad(t%60) : '');
  }
  else if(CT[st.type].speed) put('spd', val ? fmtNum(toDist(val), 1) : '');
  else { const p = val ? Math.round(val * (DU() === 'mi' ? MI : 1)) : 0; put('pm', p ? String(Math.floor(p/60)) : ''); put('ps', p ? pad(p%60) : ''); }
}
function cfCompute(st, target){
  const v = cfRead(st), speed = CT[st.type].speed;
  const has = { dist:v.km > 0, time:v.dur > 0, pace:v.rate > 0 };
  if(!['dist','time','pace'].filter(x => x !== target).every(x => has[x])) return null;
  if(target === 'pace') return speed ? v.km / (v.dur/3600) : v.dur / v.km;
  if(target === 'time') return speed ? v.km / v.rate * 3600 : v.km * v.rate;
  return speed ? v.rate * v.dur / 3600 : v.dur / v.rate;
}
function cfDerive(st, el, g){
  st.order = [g, ...st.order.filter(x => x !== g)]; st.auto.delete(g);
  if(el) Object.keys(CF_GROUP).filter(f => CF_GROUP[f] === g).forEach(f => { const i = el.querySelector(`[data-f="${f}"]`); if(i) i.classList.remove('auto'); });
  const v = cfRead(st), has = { dist:v.km > 0, time:v.dur > 0, pace:v.rate > 0 };
  const others = ['dist','time','pace'].filter(x => x !== g), age = x => { const i = st.order.indexOf(x); return i < 0 ? 99 : i; };
  const target = others.find(x => st.auto.has(x)) || others.find(x => !has[x]) || others.sort((a, b) => age(b) - age(a))[0];
  const val = cfCompute(st, target);
  if(val != null && isFinite(val) && val > 0){ cfSet(st, el, target, val); st.auto.add(target); }
  else if(st.auto.has(target)) cfSet(st, el, target, null);
}

    </div>`;
  };

        }

      },
      effort: (t, e, s) => { const k = +t.dataset.v; st.effort = st.effort === k ? 0 : k; s.rerender(); },
      more: (t, e, s) => { st.more = !st.more; s.rerender(); },
      save: (t, e, s) => {
        if(document.activeElement) document.activeElement.blur();
        const v = cfRead(st), speed = CT[st.type].speed;
        let km = v.km, dur = v.dur;
        if(!dur && km && v.rate) dur = speed ? km / v.rate * 3600 : km * v.rate;
        if(!km && dur && v.rate) km = speed ? v.rate * dur / 3600 : dur / v.rate;
        if(!(km > 0) && !(dur > 0)){ toast('Enter a distance or a time'); return; }
        if(km > 1000){ toast('That distance looks too long'); return; }
        if(dur > 48*3600){ toast('That time looks too long'); return; }
        const start = st.start || defStart();
        if(new Date(start) > new Date(Date.now() + 5*60000)){ toast('The start time is in the future'); return; }

        if(String(st.hr).trim() && !(hr >= 30 && hr <= 250)){ toast('Check the heart rate'); return; }
        if(String(st.elev).trim() && !(elev >= 0 && fromElev(elev) <= 15000)){ toast('Check the elevation'); return; }
        if(String(st.cal).trim() && !(cal >= 0 && cal <= 30000)){ toast('Check the calories'); return; }
        const a = { id: orig ? orig.id : uid(), type:st.type, start };
        if(km > 0) a.dist = Math.round(km * 1000) / 1000;
        if(dur > 0) a.dur = Math.round(dur);
        if(st.effort) a.effort = st.effort;
        if(hr > 0) a.hr = hr;
        if(elev > 0) a.elev = Math.round(fromElev(elev));
        if(cal > 0) a.cal = cal;
        if(st.indoor && CT[st.type].indoor) a.indoor = true;
        const notes = st.notes.trim(); if(notes) a.notes = notes;
        if(orig) S.cardio[S.cardio.indexOf(orig)] = a; else S.cardio.push(a);

/* ---------- Membership invites ---------- */
const b64uBytes = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while(s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
function parseInvite(raw){
  let t = String(raw || '').trim();
  const m = t.match(/[?#&]join=([A-Za-z0-9_\-.]+)/); if(m) t = m[1];
  t = t.replace(/\s+/g, '');
  const [body, sig] = t.split('.');
  if(!body || !sig) return null;
  try { return { token:t, body, sig, p:JSON.parse(new TextDecoder().decode(b64uBytes(body))) }; } catch(e){ return null; }
}
/* Checks the gym's signature. On a plain-http test server browsers hide WebCrypto,
   so the invite is accepted unchecked there (and marked); the hosted https app always checks. */
async function verifyInvite(raw){
  const inv = parseInvite(raw);
  if(!inv) return { ok:false, why:'That doesn’t look like an invite link or code. Copy the whole link the front desk sent you.' };
  const p = inv.p;
  if(p.g !== GYM.id) return { ok:false, why:'This invite is for a different gym.' };
  if(!p.n || !p.m || !/^\d{4}-\d{2}-\d{2}$/.test(p.e || '')) return { ok:false, why:'This invite is incomplete. Ask the front desk for a new one.' };
  let checked = false;
  if(window.crypto && crypto.subtle){
    try {
      const key = await crypto.subtle.importKey('jwk', GYM.access.publicKey, { name:'ECDSA', namedCurve:'P-256' }, false, ['verify']);
      checked = await crypto.subtle.verify({ name:'ECDSA', hash:'SHA-256' }, key, b64uBytes(inv.sig), new TextEncoder().encode(inv.body));
    } catch(e){ checked = false; }
    if(!checked) return { ok:false, why:'This invite couldn’t be verified. Ask the front desk for a new one.' };
  }
  return { ok:true, member:{ name:String(p.n).slice(0, 60), num:String(p.m).slice(0, 20), since:/^\d{4}-\d{2}-\d{2}$/.test(p.i || '') ? p.i : dayKey(new Date()), expires:p.e, token:inv.token, checked } };
}
function normMember(m){
  if(!m || !m.num || !m.token || !/^\d{4}-\d{2}-\d{2}$/.test(m.expires || '')) return null;
  return { name:String(m.name || ''), num:String(m.num), since:m.since || m.expires, expires:m.expires, token:String(m.token), checked:!!m.checked };
}
function memberStatus(){
  if(GYM.access.mode !== 'members') return { state:'open' };
  const m = S.member; if(!m) return { state:'none' };
  if((club().revoked || []).includes(m.num)) return { state:'revoked', m };
  const end = dateMs(m.expires) + 12*3600e3, now = Date.now();
  if(now <= end) return { state:'active', m, daysLeft:Math.ceil((end - now) / 864e5) };
  const over = Math.floor((now - end) / 864e5) + 1;
  return over <= GYM.access.graceDays ? { state:'grace', m, over, left:GYM.access.graceDays - over + 1 } : { state:'expired', m };
}

async function redeem(raw){
  const r = await verifyInvite(raw);
  if(!r.ok){ await dialog({ title:'Invite not accepted', message:r.why }); return false; }
  const prev = S.member;
  if(prev && prev.num !== r.member.num && !(await confirmDlg('Switch member?', `This phone is set up for ${prev.name}. Switch to ${r.member.name}? The training history on this phone stays as it is.`, 'Switch', false))) return false;
