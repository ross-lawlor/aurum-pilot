/* ---------- Monthly challenge ---------- */
function challengeState(now = new Date()){
  const c = club().challenge; if(!c || !(+c.target > 0)) return null;
  const monthly = c.recurring === 'monthly' || !c.start;
  const s = monthly ? new Date(now.getFullYear(), now.getMonth(), 1) : new Date(dateMs(c.start) - 12*3600e3);
  const e = monthly ? new Date(now.getFullYear(), now.getMonth() + 1, 1) : new Date(dateMs(c.end) + 12*3600e3);
  const inR = x => { const t = new Date(x.start); return t >= s && t < e; };
  const ses = S.sessions.filter(inR), car = S.cardio.filter(inR);
  const val = { sessions:ses.length + car.length, workouts:ses.length, distance:sumDist(car),
    minutes:Math.round(ses.reduce((a, x) => a + (sessDur(x) || 0) / 6e4, 0) + car.reduce((a, x) => a + (x.dur || 0) / 60, 0)),
    sets:ses.reduce((a, x) => a + sessSets(x), 0) }[c.metric] ?? 0;
  const unit = { sessions:'sessions', workouts:'workouts', distance:'km', minutes:'minutes', sets:'sets' }[c.metric] || '';
  const title = monthly ? `${c.title} · ${s.toLocaleDateString(undefined, { month:'long' })}` : c.title;
  return { c, val, target:+c.target, pct:Math.min(1, val / c.target), done:val >= c.target, unit, title, s, e,
    daysLeft:Math.max(0, Math.ceil((e - now) / 864e5)), started:now >= s };
}

}
function chalLine(ch){

/* ---------- Monthly recap: shareable image + summary for the coach ---------- */
function monthStats(now = new Date()){
  const s = new Date(now.getFullYear(), now.getMonth(), 1), e = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const inR = x => { const t = new Date(x.start); return t >= s && t < e; };
  const ses = S.sessions.filter(inR), car = S.cardio.filter(inR), prs = cache().prs, cprs = cardioCache().prs;
  const sec = ses.reduce((a, x) => a + (sessDur(x) || 0) / 1000, 0) + car.reduce((a, x) => a + (x.dur || 0), 0);
  const prCount = ses.reduce((a, x) => a + (prs[x.id] || []).length, 0) + car.reduce((a, x) => a + (cprs[x.id] || []).length, 0);
  let top = null;
  ses.forEach(x => x.entries.forEach(en => en.sets.forEach(st => { if(st.w > 0 && !st.t && (!top || st.w > top.w)) top = { w:st.w, r:st.r, name:en.name }; })));
  return { month:s.toLocaleDateString(undefined, { month:'long', year:'numeric' }), monthShort:s.toLocaleDateString(undefined, { month:'long' }),
    count:ses.length + car.length, sec, prCount, top, km:sumDist(car), ch:challengeState(now) };
}

/* ---------- Sample member for the demo ----------
   Ten weeks of Coach Sipho's programme ending today, plus runs, parkrun,
   walks, a hike and weekly weigh-ins. Dates are relative to now; the
   random numbers use a fixed seed so every device shows the same member. */
function rng(seed){
  return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function demoState(){
  const R = rng(20261108), rnd = (a, b) => a + R() * (b - a);
  const r1 = v => Math.round(v * 10) / 10, r2 = v => Math.round(v * 100) / 100;
  const st = freshState();
  st.exercises = defaultExercises(); addStarterRoutines(st.exercises, st.routines);
  Object.assign(st.settings, { name:GYM.member, lastBackup:new Date().toISOString(), distUnit:'km' });
  const routine = name => st.routines.find(r => r.name === name);
  // [starting kg, kg gained per week, plate step]; bodyweight moves grow reps instead.
  const LOAD = { 'Squat':[80,2.4,2.5], 'Romanian Deadlift':[70,1.8,2.5], 'Bulgarian Split Squat':[16,.5,2], 'Hip Thrust':[90,2.8,2.5],
    'Bench Press':[65,1.4,2.5], 'Barbell Row':[57.5,1.2,2.5], 'Overhead Press':[42.5,.7,2.5], 'Face Pull':[20,.6,2.5],
    'Deadlift':[110,3,2.5], 'Front Squat':[60,1.8,2.5], 'Dumbbell Shoulder Press':[20,.5,2], 'Dumbbell Row':[26,.7,2], 'Kettlebell Swing':[20,.5,4] };
  const BW = { 'Pull-Up':[6,4], 'Hanging Leg Raise':[10,5] };
  const TIMED = { 'Burpees':[9,4], 'Mountain Climbers':[28,10], 'Jump Squat':[13,5] };
  const NOTES = { 'Strength Block · Day A:8':'New squat best — depth felt solid.', 'Strength Block · Day B:6':'Bench moving well. Shoulder fine.' };
  const WEEKS = 10, now = new Date(), cutoff = now.getTime() - 45*60000;
  const start0 = addDays(startOfWeek(now), -7*(WEEKS - 1));
  const at = (w, dow, h, m) => { const d = addDays(start0, 7*w + dow); d.setHours(h, m, 0, 0); return d; };
  const PLAN = [
    { dow:0, kind:'lift', r:'Strength Block · Day A', h:17, m:45 }, { dow:1, kind:'run', h:6, m:15 },
    { dow:2, kind:'lift', r:'Strength Block · Day B', h:17, m:30 }, { dow:3, kind:'lift', r:'Aurum Engine', h:6, m:30 },
    { dow:4, kind:'lift', r:'Strength Block · Day C', h:17, m:0 },  { dow:5, kind:'sat', h:7, m:30 }
  ];
  for(let w = 0; w < WEEKS; w++){
    const p = w / (WEEKS - 1);
    for(const slot of PLAN){
      const t = at(w, slot.dow, slot.h, slot.m + Math.round(rnd(-10, 10)));
      if(t.getTime() > cutoff || R() < .08) continue;
      const iso = t.toISOString(), mins = m => new Date(t.getTime() + m*60000).toISOString();
      if(slot.kind === 'lift'){
        const r = routine(slot.r), engine = slot.r === 'Aurum Engine';
        const entries = r.items.map(it => {
          const e = st.exercises.find(x => x.id === it.exId), n = it.sets, target = parseInt(it.note, 10) || 8;
          let sets;
          if(isTimedEx(e)){
            const iv = exIv(e), tr = TIMED[e.name];
            sets = Array.from({ length:n }, (_, i) => tr ? { w:0, r:Math.round(tr[0] + tr[1]*p) - (i === n-1 ? 1 : 0), t:iv.work } : { w:0, r:0, t:iv.work + 5*Math.floor(p*3) });
          } else if(BW[e.name]){
            const [b, g] = BW[e.name];
            sets = Array.from({ length:n }, (_, i) => ({ w:0, r:Math.max(1, Math.round(b + g*p) - (i === n-1 ? 1 : 0)) }));
          } else {
            const [b, g, step] = LOAD[e.name] || [20, .5, 2.5], load = Math.round((b + g*w) / step) * step;
            sets = Array.from({ length:n }, (_, i) => ({ w:load, r:i < n - 1 || target < 5 ? target : target - (R() < .4 ? 1 : 0) }));
          }
          return { exId:e.id, name:e.name, cat:e.cat, sets };
        });
        st.sessions.push({ id:uid(), name:r.name, start:iso, end:mins(engine ? rnd(24, 30) : rnd(50, 66)), legacy:false, routineId:r.id, notes:NOTES[`${r.name}:${w}`] || '', entries });
      } else if(slot.kind === 'run'){
        const dist = r2(rnd(5, 8)), pace = 345 - 35*p + rnd(-8, 8);
        st.cardio.push({ id:uid(), type:'run', start:iso, dist, dur:Math.round(dist*pace), effort:2, hr:Math.round(rnd(148, 158)) });
      } else if(w === WEEKS - 4){
        st.cardio.push({ id:uid(), type:'hike', start:iso, dist:5.6, dur:2*3600 + 25*60, elev:669, effort:3, cal:780, notes:'Lion’s Head with the Aurum crew' });
      } else if(w % 2 === 0){
        const pace = 322 - 32*p + rnd(-6, 6);
        st.cardio.push({ id:uid(), type:'run', start:iso, dist:5, dur:Math.round(5*pace), effort:4, hr:Math.round(rnd(166, 174)), notes:'parkrun' });
      } else {
        const dist = r2(rnd(6, 8));
        st.cardio.push({ id:uid(), type:'walk', start:iso, dist, dur:Math.round(dist*rnd(590, 630)), effort:1, notes:'Sunday walk' });
      }
    }
    const d = addDays(start0, 7*w + 6);
    if(d.getTime() < cutoff || w === 0){
      const e = { id:uid(), date:dayKey(w === 0 ? start0 : d), weight:r1(86.4 - 3.6*p + rnd(-.3, .3)) };
      if(w % 2 === 0){ e.waist = r1(93 - 4.5*p + rnd(-.3, .3)); e.bodyfat = r1(22 - 3*p + rnd(-.2, .2)); }
      st.body.entries.push(e);
    }
  }
  st.body.height = 182;
  st.body.track = ['weight', 'bodyfat', 'waist'];
  return st;
}

/* ---------- Plate calculator ---------- */
function plateHTML(target){
  const u = U(), bar = S.settings.bar[u], plates = [...S.settings.plates[u]].sort((a,b) => b - a);
  if(isNaN(target)) return '';
  if(target < bar) return `<div class="plate-text muted" style="margin-top:30px">That’s less than the bar (${fmtNum(bar)} ${u}).</div>`;
  let side = (target - bar) / 2 + 1e-9; const used = [];
  for(const p of plates){ while(side >= p){ used.push(p); side -= p; } }
  const actual = bar + 2 * used.reduce((a,b) => a + b, 0), max = plates[0] || 1;
  const col = p => (PLATE_COLORS[u] || {})[p] || '#8e8e93';
  return `<div class="bar-vis"><div class="bv-shaft"></div><div class="bv-collar"></div>${used.map(p => `<div class="bv-plate" style="height:${Math.round(44 + 96 * p / max)}px;background:${col(p)}"></div>`).join('')}<div class="bv-sleeve"></div></div>
    <div class="plate-text">${used.length ? `Each side: <b>${used.map(p => fmtNum(p)).join(' + ')}</b>` : 'Just the bar'}<div class="small muted">Bar ${fmtNum(bar)} ${u}${Math.abs(actual - target) > 1e-6 ? ` · closest you can load is <b style="color:var(--orange)">${fmtNum(actual)} ${u}</b>` : ''}</div></div>`;
}

      <div class="plate-out"></div></div>`,
    mount: s => { const i = s.el.querySelector('.pi'); i.oninput = () => { st.v = toNum(i.value); out(s); }; out(s); },
    actions: { step: (t, e, s) => { st.v = Math.max(0, (isNaN(st.v) ? 0 : st.v) + (+t.dataset.d) * step); s.el.querySelector('.pi').value = fmtNum(st.v); out(s); } }
  });
}

/* =========================================================
   Backup, import, CSV
   ========================================================= */
function backupJSON(){ return JSON.stringify({ app:'IronTrack', version:4, exportedAt:new Date().toISOString(), data:{ settings:S.settings, exercises:S.exercises, routines:S.routines, sessions:S.sessions, body:S.body, cardio:S.cardio } }); }
function markBackup(){ S.settings.lastBackup = new Date().toISOString(); save(); if(ui.tab === 'settings' || ui.tab === 'workout') render(); }
async function saveFile(name, text, type){
  const blob = new Blob([text], { type });
  if(matchMedia('(pointer:coarse)').matches){
    try {
      const file = new File([blob], name, { type });
      if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:name }); return true; }
    } catch(e){ if(e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}
async function exportFile(){ if(await saveFile(`irontrack-backup-${dayKey(new Date())}.json`, backupJSON(), 'application/json')){ markBackup(); toast('Backup saved'); } }
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
  document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
  let ok = false; try { ok = document.execCommand('copy'); } catch(e){}
  ta.remove(); return ok;
}
async function copyCode(){
  if(await copyText(backupJSON())){ markBackup(); toast('Backup code copied — paste it into Notes'); }
  else dialog({ title:'Copy this code', message:'Your browser blocked automatic copying. Select all of the text below and copy it.', input:{ multiline:true, value:backupJSON() }, buttons:[{ k:'ok', label:'Done', bold:true }] });
}
function parseBackup(text){
  let o;
  try { o = JSON.parse(String(text).trim()); } catch(e){ throw new Error('That doesn’t look like IronTrack backup data.'); }
  if(o && o.data && Array.isArray(o.data.sessions)) o = o.data;
  if(o && Array.isArray(o.sessions)){ const n = normalize(o); return { exercises:n.exercises, sessions:n.sessions, routines:n.routines, settings:o.settings ? n.settings : null, body:o.body ? n.body : null, cardio:Array.isArray(o.cardio) ? n.cardio : null }; }
  if(o && Array.isArray(o.history) && Array.isArray(o.exercises)){ const c = fromV3(o); return { exercises:c.exercises, sessions:c.sessions, routines:[], settings:null, body:null, cardio:null }; }
  throw new Error('No workouts were found in that data.');
}
async function importText(text){
  let p;
  try { p = parseBackup(text); } catch(e){ dialog({ title:'Couldn’t import', message:e.message }); return; }
  const bodyN = p.body ? p.body.entries.length : 0, cardN = p.cardio ? p.cardio.length : 0;
  const k = await dialog({ title:'Import backup', message:`Found ${plural(p.sessions.length,'workout')}, ${plural(p.exercises.length,'exercise')}, ${plural(p.routines.length,'routine')}${cardN ? `${bodyN ? ',' : ' and'} ${cardN} cardio ${cardN === 1 ? 'activity' : 'activities'}` : ''}${bodyN ? ` and ${bodyN} body ${bodyN === 1 ? 'entry' : 'entries'}` : ''}.`,
    buttons:[{ k:'merge', label:'Merge With My Data', bold:true }, { k:'replace', label:'Replace All My Data', red:true }, { k:'cancel', label:'Cancel' }] });
  if(k === 'replace'){
    if(!(await confirmDlg('Replace everything?', 'Your current workouts, exercises and routines will be overwritten by the backup.', 'Replace'))) return;
    S.exercises = p.exercises.length ? p.exercises : S.exercises; S.sessions = p.sessions; S.routines = p.routines;
    if(p.settings) S.settings = { ...p.settings, lastBackup:S.settings.lastBackup };
    if(p.body) S.body = p.body;
    if(p.cardio) S.cardio = p.cardio;
  } else if(k === 'merge'){
    const remap = {};
    for(const e of p.exercises){
      if(S.exercises.some(x => x.id === e.id)) continue;
      const same = S.exercises.find(x => x.name.toLowerCase() === e.name.toLowerCase());
      if(same) remap[e.id] = same.id; else S.exercises.push(e);
    }
    const fix = id => remap[id] || id;
    const ids = new Set(S.sessions.map(s => s.id));
    let added = 0;
    for(const s of p.sessions){ if(ids.has(s.id)) continue; s.entries.forEach(e => { e.exId = fix(e.exId); }); S.sessions.push(s); added++; }
    const rids = new Set(S.routines.map(r => r.id));
    for(const r of p.routines){ if(rids.has(r.id)) continue; r.items.forEach(i => { i.exId = fix(i.exId); }); S.routines.push(r); }
    const cids = new Set(S.cardio.map(a => a.id));
    let addedC = 0;
    for(const a of p.cardio || []){ if(cids.has(a.id)) continue; S.cardio.push(a); addedC++; }
    if(p.body){
      for(const e of p.body.entries){
        const mine = S.body.entries.find(x => x.date === e.date);
        if(!mine) S.body.entries.push(e);
        else BODY_METRICS.forEach(m => { if(mine[m.k] == null && e[m.k] != null) mine[m.k] = e[m.k]; });
      }
      if(!S.body.height && p.body.height) S.body.height = p.body.height;
      S.body.track = BODY_METRICS.map(m => m.k).filter(k => S.body.track.includes(k) || p.body.track.includes(k));
    }
    save(); refresh(); toast(`Merged — ${plural(added,'new workout')}${addedC ? ` and ${addedC} cardio` : ''} added`); return;
  } else return;
  save(); refresh(); toast('Backup restored');
}
async function pasteCode(){
  const r = await dialog({ title:'Paste backup code', message:'Paste a code copied from IronTrack — this works with codes from the old v3 app too.', input:{ multiline:true, placeholder:'Paste here…' }, buttons:[{ k:'cancel', label:'Cancel' }, { k:'ok', label:'Import', bold:true }] });
  if(r.k === 'ok' && r.value.trim()) importText(r.value);
}
function toCSV(rows){
  const cell = v => { const t = String(v ?? ''); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  return '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}
function exportCSV(){
  const u = U(), rows = [['Date','Time','Workout','Exercise','Muscle group','Set',`Weight (${u})`,'Reps','Time (s)',`Est. 1RM (${u})`,'Duration (min)','Notes']];
  for(const s of cache().sorted){
    const d = new Date(s.start), dur = sessDur(s);
    s.entries.forEach(e => e.sets.forEach((x, i) => rows.push([dayKey(d), s.legacy ? '' : fmtTime(s.start), s.name, e.name, e.cat, i+1, fmtW(x.w), x.r || '', x.t || '', x.w && !x.t ? fmtW1(e1rm(x.w, x.r)) : '', dur ? Math.round(dur/60000) : '', s.notes || ''])));
  }
  saveFile(`irontrack-${dayKey(new Date())}.csv`, toCSV(rows), 'text/csv').then(ok => { if(ok) toast('CSV exported'); });
}
function exportBodyCSV(){
  if(!S.body.entries.length){ toast('No body measurements logged yet'); return; }
  const rows = [['Date', ...BODY_METRICS.map(m => `${m.label} (${metricUnit(m)})`)]];
  S.body.entries.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(e => rows.push([e.date, ...BODY_METRICS.map(m => e[m.k] != null ? fmtMetric(m, e[m.k]) : '')]));
  saveFile(`irontrack-body-${dayKey(new Date())}.csv`, toCSV(rows), 'text/csv').then(ok => { if(ok) toast('Body metrics exported'); });
}
async function eraseAll(){
  if(!(await confirmDlg('Erase all data?', 'Every workout, cardio activity, exercise, routine and body measurement will be deleted from this device, so you can try the app from empty. You can bring the sample member back with Reset sample data.', 'Erase Everything'))) return;
  const settings = S.settings;
  const member = S.member; S = freshState(); S.settings = settings; S.member = member; S.exercises = defaultExercises(); addStarterRoutines(S.exercises, S.routines);
  rest.end = 0; rest.doneUntil = 0;
  save(); syncWakeLock(); refresh(); toast('All data erased');
}

/* =========================================================
   Keyboard accessory bar (± steppers, plates, tick) for set inputs
   ========================================================= */
const kbd = $('#kbd');
let kbdTarget = null;
function posKbd(){
  if(kbd.classList.contains('hidden')) return;
  const vv = window.visualViewport;
  const off = vv ? window.innerHeight - vv.height - vv.offsetTop : 0;
  kbd.style.transform = `translateY(${-Math.max(0, off)}px)`;
}
function showKbd(t){
  kbdTarget = t;
  const isW = t.dataset.f === 'w', step = kbdStep(t);
  kbd.innerHTML = `<button data-k="-">−${fmtNum(step)}</button><button data-k="+">+${fmtNum(step)}</button>${isW ? `<button data-k="plates" aria-label="Plate calculator">${ic('plates')}</button>` : ''}<span class="sp"></span>${t.closest('.editor.edit') ? '' : `<button class="ok" data-k="tick">${ic('check')} Done set</button>`}`;
  kbd.classList.remove('hidden'); posKbd();
  setTimeout(() => {
    const vv = window.visualViewport, limit = (vv ? vv.height + vv.offsetTop : window.innerHeight) - kbd.offsetHeight - 8;
    const r = t.getBoundingClientRect();
    if(r.bottom > limit) t.scrollIntoView({ block:'center', behavior:'smooth' });
  }, 320);
}
function kbdStep(t){ const f = t.dataset.f; return f === 'w' ? (U() === 'lb' ? 5 : 2.5) : f === 't' ? 5 : 1; }
function hideKbd(){ kbd.classList.add('hidden'); kbdTarget = null; }
document.addEventListener('focusin', e => { if(e.target.classList && e.target.classList.contains('set-in')) showKbd(e.target); else hideKbd(); });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if(!a || !a.classList || !a.classList.contains('set-in')) hideKbd(); }, 60));
['pointerdown', 'mousedown'].forEach(ev => kbd.addEventListener(ev, e => e.preventDefault()));
kbd.addEventListener('click', e => {
  const b = e.target.closest('[data-k]'), t = kbdTarget; if(!b || !t) return;
  const k = b.dataset.k, isW = t.dataset.f === 'w';
  if(k === '+' || k === '-'){
    const step = kbdStep(t);
    let cur = toNum(t.value); if(isNaN(cur)) cur = toNum(t.placeholder); if(isNaN(cur)) cur = 0;
    let nv = Math.max(0, cur + (k === '+' ? step : -step));
    nv = isW ? Math.round(nv * 100) / 100 : Math.round(nv);
    t.value = String(nv); t.dispatchEvent(new Event('input', { bubbles:true }));
  } else if(k === 'plates'){
    const v = toNum(t.value) || toNum(t.placeholder); t.blur(); openPlates(isNaN(v) ? null : fromDisp(v));
  } else if(k === 'tick'){
    const btn = t.closest('.set-row')?.querySelector('[data-ed=check]'); t.blur(); if(btn) btn.click();
  }
});
if(window.visualViewport){ visualViewport.addEventListener('resize', posKbd); visualViewport.addEventListener('scroll', posKbd); }

  'rest-adj': t => adjustRest(+t.dataset.d),

    if(k) openSession(k);
  },
  ex: t => openExerciseDetail(t.dataset.id),
  'new-ex': () => openExerciseForm(null, { cat: ui.exCat !== 'All' ? ui.exCat : 'Other' }),
  'ex-cat': t => { ui.exCat = t.dataset.v; document.querySelectorAll('#v-exercises .chip').forEach(c => c.classList.toggle('on', c.dataset.v === ui.exCat)); $('#ex-list').innerHTML = exListHTML(); },
  unit: t => { S.settings.unit = t.dataset.v; save(); render(); },
  'rest-step': t => { S.settings.rest = Math.max(15, Math.min(600, S.settings.rest + (+t.dataset.d))); save(); render(); },
  'bar-step': t => { const u = U(), step = u === 'kg' ? 2.5 : 5; S.settings.bar[u] = Math.max(0, S.settings.bar[u] + (+t.dataset.d) * step); save(); render(); },
  'plates-edit': async () => {
    const u = U();

    if(v == null) return;

  'export-file': () => exportFile(),

  'export-csv': () => exportCSV(),

  'install-x': () => { prefSet('it_hide_install', '1'); render(); },
  'prog-view': t => { ui.progView = t.dataset.v; render(); },
  'len-unit': t => { S.settings.lenUnit = t.dataset.v; save(); render(); },
  'body-log': () => openBodyLog(),
  'body-track': () => openBodyTrack(),
  'body-height': () => editHeight(),
  'body-remind': () => chooseRemind(),
  'body-nudge-x': () => { prefSet('it_body_nudge', String(Date.now())); render(); },
  metric: t => openMetric(t.dataset.k),
  'export-body-csv': () => exportBodyCSV(),
  'log-cardio': () => openCardioLog(null),
  tour: () => openTour(),
  'start-pick': () => startPicker(),
  'set-name': () => editName(),
  'demo-reset': () => resetDemo(),
  'tip-x': () => { prefSet('au_tip_live', '1'); render(); },
  'club-refresh': () => fetchClub(true),

  'club-book': t => contact('book', t.dataset.v),

  'share-month': () => shareMonth(),

  'open-console': () => window.open('admin.html', '_blank'),
  'cardio-progress': () => { ui.progView = 'cardio'; setTab('progress'); },
  cardio: t => openCardio(t.dataset.id),
  'cardio-filter': t => { ui.cardioType = t.dataset.v; render(); },
  'dist-unit': t => { S.settings.distUnit = t.dataset.v; save(); render(); },
  'export-cardio-csv': () => exportCardioCSV(),
  'hist-add': async () => {

    if(k === 'w') logFinished(); else if(k === 'c') openCardioLog(null);

  'add-starters': () => {

};
